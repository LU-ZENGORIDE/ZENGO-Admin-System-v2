/* ---------------- Route Map (ported from components/booking/RouteMap.tsx) ---------------- */
function hashRouteName(str) { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 9973; return h; }
function RouteMap({ waypoints }) {
  const points = [
    { name: waypoints.pickup || "Pick-up", kind: "start" },
    ...waypoints.stopovers.map((s) => ({ name: s.location || "Stop", kind: "stop" })),
    { name: waypoints.dropoff || "Drop-off", kind: "end" },
  ];
  const n = points.length;
  const coords = points.map((p, i) => ({ x: n === 1 ? 50 : 14 + (72 * i) / (n - 1), y: 34 + (hashRouteName(p.name + i) % 34) }));
  const polyline = coords.map((c) => `${c.x},${c.y}`).join(" ");
  return (
    <div className="mt-3 overflow-hidden rounded-xl border border-gray-200 bg-white">
      <div className="flex items-center justify-between gap-3 border-b border-gray-100 bg-gray-50/80 px-3.5 py-2.5">
        <p className="text-[11px] font-bold uppercase tracking-wide text-gray-400">Route overview</p>
        <p className="text-xs text-gray-400">{n} points · schematic order, not to scale</p>
      </div>
      <div className="relative h-[260px]" style={{ backgroundColor: "#f7f8fa", backgroundImage: "linear-gradient(#e9ebef 1px, transparent 1px), linear-gradient(90deg, #e9ebef 1px, transparent 1px)", backgroundSize: "32px 32px" }}>
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="absolute inset-0 h-full w-full">
          <polyline points={polyline} fill="none" stroke="#121621" strokeWidth={0.4} strokeDasharray="1.6 1.2" vectorEffect="non-scaling-stroke" />
        </svg>
        {points.map((p, i) => {
          const c = coords[i];
          const color = p.kind === "start" ? "#16a34a" : p.kind === "end" ? "#dc2626" : "#121621";
          const marker = p.kind === "start" ? "A" : p.kind === "end" ? "B" : String(i);
          return (
            <div key={`${p.name}-${i}`} className="absolute flex max-w-[132px] -translate-x-1/2 -translate-y-1/2 flex-col items-center gap-1.5" style={{ left: `${c.x}%`, top: `${c.y}%` }}>
              <span className="flex h-6 w-6 items-center justify-center rounded-full text-[11px] font-bold text-white shadow" style={{ background: color }}>{marker}</span>
              <span className="max-w-[132px] truncate rounded-md border border-gray-200 bg-white/95 px-1.5 py-0.5 text-[11px] font-semibold text-gray-900">{p.name}</span>
            </div>
          );
        })}
      </div>
      <div className="flex flex-wrap items-center gap-4 border-t border-gray-100 bg-gray-50/80 px-3.5 py-2.5 text-[11px] text-gray-400">
        <span className="inline-flex items-center gap-1.5"><span className="h-2 w-2 rounded-full bg-emerald-600" />Start</span>
        <span className="inline-flex items-center gap-1.5"><span className="h-2 w-2 rounded-full bg-[#121621]" />Stopover</span>
        <span className="inline-flex items-center gap-1.5"><span className="h-2 w-2 rounded-full bg-red-600" />End</span>
      </div>
    </div>
  );
}

const AirportPricingCtx = createContext({ airportRows: AIRPORT_PRICE_SEED, setAirportRows: () => {} });
function loadAirportRowsForOfficeAirport(office, airport, sourceRows = AIRPORT_PRICE_SEED) {
  return sourceRows.filter((row) => (row.offices || []).includes(office) && row.available).flatMap((row) => {
    const leg = row.legs.find((l) => l.airport === airport);
    if (!leg) return [];
    return [{ vehicleType: row.vehicleType, vehicleName: row.vehicleName, owner: row.owner, fixedFee: leg.ranges?.[0]?.fixedFee ?? 0, ranges: leg.ranges ?? [], custom: false, customPrice: "" }];
  });

function AirportVehiclePricingTable({ officeLocation, airport, pricing, onChange, locked = false }) {
  const stale = pricing !== null && (pricing.office !== officeLocation || pricing.airport !== airport);
  const activeOffice = pricing?.office ?? officeLocation;
  const activeAirport = pricing?.airport ?? airport;
  const { airportRows: cmsAirportRows } = useContext(AirportPricingCtx);
  /* Always render the live CMS vehicles + ranges; a saved template only contributes its Custom flags / prices. */
  const liveRows = loadAirportRowsForOfficeAirport(activeOffice, activeAirport, cmsAirportRows);
  const savedByKey = new Map((pricing?.rows ?? []).map((r) => [pricingRowKey(r), r]));
  const activeRows = liveRows.map((row) => { const prev = savedByKey.get(pricingRowKey(row)); return prev ? { ...row, custom: prev.custom, customPrice: prev.customPrice } : row; });
  const handleReload = () => {
    const freshRows = loadAirportRowsForOfficeAirport(officeLocation, airport, cmsAirportRows);

    const rows = freshRows.map((row) => { const prev = prevByKey.get(pricingRowKey(row)); return prev ? { ...row, custom: prev.custom, customPrice: prev.customPrice } : row; });
    onChange({ office: officeLocation, airport, rows });

function SortIcon({ active, dir }) {
  if (!active) return <IconArrowUpDown size={12} className="text-gray-300" />;

function RegionManagementModal({ tours, onClose }) {
  const { regions, saveRegions } = useContext(RegionsCtx);
  const [rows, setRows] = useState(() => regions.map((r, i) => ({ key: `r-${i}`, original: r, name: r })));
  const [error, setError] = useState("");
  const usage = (name) => (name ? tours.filter((t) => t.serviceType !== "Airport" && t.region === name).length : 0);
  const patchRow = (key, name) => { setRows((prev) => prev.map((r) => (r.key === key ? { ...r, name } : r))); setError(""); };
  const addRow = () => setRows((prev) => [...prev, { key: `new-${Date.now()}`, original: null, name: "" }]);
  const removeRow = (key) => setRows((prev) => prev.filter((r) => r.key !== key));
  const handleSave = () => {
    const cleaned = rows.map((r) => ({ ...r, name: r.name.trim() }));
    if (cleaned.some((r) => !r.name)) return setError("Every region needs a name.");
    const names = cleaned.map((r) => r.name.toLowerCase());
    if (new Set(names).size !== names.length) return setError("Region names must be unique.");
    saveRegions(cleaned.map(({ original, name }) => ({ original, name })));
    onClose();
  };
  return (
    <ModalShell title="Region Management" onClose={onClose}
      footer={(<>
        {error && <p className="mr-auto text-xs font-medium text-red-600">{error}</p>}
        <button type="button" onClick={onClose} className="rounded-lg border px-4 py-2 text-sm font-medium transition hover:bg-black/5" style={{ borderColor: "var(--border)", color: "var(--text-2)" }}>Cancel</button>
        <button type="button" onClick={handleSave} className="rounded-lg bg-[#FACC15] px-5 py-2 text-sm font-semibold text-[#121621] transition hover:bg-[#eab308]">Save</button>
      </>)}>
      <p className="text-xs" style={{ color: "var(--text-3)" }}>Regions group templates for customers (e.g. the Tour Charter Product Catalog filter). Renaming a region updates every template that uses it.</p>
      <div className="flex flex-col gap-2">
        {rows.map((r) => {
          const count = usage(r.original);
          return (
            <div key={r.key} className="flex items-center gap-2">
              <input type="text" value={r.name} onChange={(e) => patchRow(r.key, e.target.value)} placeholder="Region name"
                className={fieldBox} style={{ borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-1)" }} />
              <span className="w-24 shrink-0 text-right text-xs tabular-nums" style={{ color: "var(--text-3)" }}>{count} template{count === 1 ? "" : "s"}</span>
              <button type="button" disabled={count > 0} onClick={() => removeRow(r.key)}
                title={count > 0 ? "In use — move its templates to another region first" : "Remove region"}
                className="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-red-400 transition hover:bg-red-50 hover:text-red-600 disabled:cursor-not-allowed disabled:text-gray-300 disabled:hover:bg-transparent">
                <IconTrash size={15} />
              </button>
            </div>
          );
        })}
      </div>
      <button type="button" onClick={addRow} className="inline-flex w-fit items-center gap-1.5 rounded-lg border px-3 py-1.5 text-xs font-semibold transition hover:bg-black/5" style={{ borderColor: "var(--border)", color: "var(--text-2)" }}>
        <IconPlus size={13} />Add region
      </button>
    </ModalShell>
  );
}

  const selectServiceType = (type) => {
    const newId = draftIdForServiceType(type);
    let patch = { serviceType: type, id: newId, reference: newId, price: null, vehiclePricing: null, airportVehiclePricing: null, fixedRoutePricing: null };
    if (type === "Sightseeing Charter") {
      patch = { ...patch, airport: null };
    } else if (type === "Airport") {
      const resolved = resolveAirportPickup(draft.officeLocation);
      patch = { ...patch, durationTier: null, airport: resolved.airport };
      patch = applyPickupResolution(patch, resolved);
    } else {
      patch = { ...patch, durationTier: null, airport: null };
    }
    commit("Service type selected", patch);
  };
  const selectOffice = (loc) => {
    /* Follow the office's default region unless the region was set to something else by hand. */
    const regionIsDefault = draft.serviceType !== "Airport" && (!draft.region || draft.region === OFFICE_REGION[draft.officeLocation]);
    const officeDefault = regions.includes(OFFICE_REGION[loc]) ? OFFICE_REGION[loc] : null;
    let patch = withSuggestedPrice({ officeLocation: loc, ...(regionIsDefault ? { region: officeDefault ?? draft.region ?? null } : {}) });
    if (draft.serviceType === "Airport") {
      const resolved = resolveAirportPickup(loc);
      patch = { ...patch, airport: resolved.airport };
      patch = applyPickupResolution(patch, resolved);
    }
    commit("Office changed", patch);
  };
  const selectAirport = (airport) => {
    const patch = applyPickupResolution({ airport }, { pickup: airportDisplayName(airport), pickupMapLocation: AIRPORT_MAP_LOCATIONS[airport] ?? null });
    commit("Airport selected", patch);
  };
  const toggleStatusNow = () => {
    const next = draft.status === "active" ? "inactive" : "active";
    setDraft((prev) => (prev ? { ...prev, status: next } : prev));
    if (!isNew) {
      setBaseline((prev) => (prev ? { ...prev, status: next } : prev));
      onToggleStatus(tour.id);
    }
  };
  const undo = () => {
    if (history.length === 0) return;
    const last = history[history.length - 1];
    setHistory(history.slice(0, -1));
    setDraft(last.snapshot);
    setRouteEditing(false);
    setRouteCopy(null);
    setSaveError(null);
  };
  const enterEdit = () => setMode("edit");
  const cancelEdits = () => {
    if (mode === "view" || !baseline) { onClose(); return; }
    setDraft(clone(baseline));
    setMode("view");
    setHistory([]);
    setRouteEditing(false);
    setRouteCopy(null);
    setSaveError(null);
  };
  const editRoute = () => { setMode("edit"); setRouteEditing(true); setRouteCopy(clone(draft.waypoints)); };
  const discardRoute = () => { setRouteEditing(false); setRouteCopy(null); };
  const applyRoute = () => {
    if (!routeCopy) return;
    const unchanged = JSON.stringify(draft.waypoints) === JSON.stringify(routeCopy);
    if (unchanged) { setRouteEditing(false); setRouteCopy(null); setSaveError(null); return; }
    const metrics = estimateRouteMetrics(routeCopy);
    setHistory((h) => [...h, { label: "Route updated", snapshot: clone(draft) }]);
    setDraft({ ...draft, waypoints: clone(routeCopy), startTime: routeCopy.pickupTime, routeDistanceKm: metrics?.distanceKm ?? null, routeDurationMins: metrics?.durationMins ?? null });
    setRouteEditing(false);
    setRouteCopy(null);
    setSaveError(null);
  };
  const onFieldFocus = () => { fieldSnapshotRef.current = clone(draft); };
  const onFieldBlur = () => {
    const before = fieldSnapshotRef.current;
    fieldSnapshotRef.current = null;
    if (!before) return;
    if (JSON.stringify(before) === JSON.stringify(draft)) return;
    setHistory((h) => [...h, { label: "Field edited", snapshot: before }]);
  };
  const handleVehiclePricingChange = (pricing) => {
    if (pricing === null && draft.vehiclePricing) commit("Vehicle prices cleared", { vehiclePricing: null });
    else update({ vehiclePricing: pricing });
  };
  const handleAirportVehiclePricingChange = (pricing) => {
    if (pricing === null && draft.airportVehiclePricing) commit("Vehicle prices cleared", { airportVehiclePricing: null });
    else update({ airportVehiclePricing: pricing });
  };
  const handleFixedRoutePricingChange = (pricing) => {
    if (pricing === null && draft.fixedRoutePricing) commit("Vehicle prices cleared", { fixedRoutePricing: null });
    else update({ fixedRoutePricing: pricing });
  };
  const handleSave = () => {
    if (!draft.tripName.trim()) return setSaveError("Give the template a trip name before saving.");
    if (!draft.serviceType) return setSaveError("Select a service type before saving.");
    if (!draft.officeLocation) return setSaveError("Select an office location before saving.");
    if (draft.serviceType === "Sightseeing Charter" && !draft.durationTier) return setSaveError("Select a duration tier before saving.");
    if (draft.serviceType === "Airport" && !draft.airport) return setSaveError("Select an airport before saving.");
    const hasMissingCustomPrice = draft.vehiclePricing?.rows.some((row) => row.custom && !row.customPrice.trim()) || draft.airportVehiclePricing?.rows.some((row) => row.custom && !row.customPrice.trim()) || draft.fixedRoutePricing?.rows.some((row) => row.custom && !row.customPrice.trim());
    if (hasMissingCustomPrice) return setSaveError("Set a custom price for every vehicle with Custom turned on, or turn Custom off.");
    setSaveError(null);
    onSave({ ...draft, reference: draft.id, startTime: draft.waypoints.pickupTime });
  };

  const wp = routeEditing && routeCopy ? routeCopy : draft.waypoints;
  const readyForPrice = draft.serviceType === "Sightseeing Charter" ? !!draft.officeLocation && !!draft.durationTier : draft.serviceType === "Airport" ? !!draft.officeLocation : false;
  const canSave = !!draft.tripName.trim() && !!draft.serviceType && !!draft.officeLocation && (draft.serviceType === "Airport" ? !!draft.airport : draft.serviceType === "Sightseeing Charter" ? !!draft.durationTier : true);
  const dirty = baseline ? JSON.stringify(baseline) !== JSON.stringify(draft) : true;
  const saveEnabled = canSave && dirty && hasEdits && !routeEditing;
  const lastLabel = history.length ? history[history.length - 1].label : hasCustomOverride ? "Custom price set" : "";
  const footerNote = saveError ? saveError : mode === "view" ? "Viewing — locked. Choose Edit template to make changes." : routeEditing ? "Editing route — choose Set route to apply it to this template." : hasEdits ? `${history.length || 1} unsaved change${(history.length || 1) === 1 ? "" : "s"} · last: ${lastLabel}` : "No changes yet.";
  const footerNoteClass = saveError ? "font-medium text-red-600" : hasEdits && mode === "edit" ? "font-medium" : "";

  const fieldClass = `w-full rounded-lg border px-3 py-2.5 text-sm outline-none ${locked ? "cursor-default" : "focus:border-gray-400"}`;
  const numFieldClass = `w-full rounded-lg border px-3 py-2 text-sm outline-none ${locked ? "cursor-default" : "focus:border-gray-400"}`;
  const smallFieldClass = numFieldClass;
  const fieldStyle = locked ? { borderColor: "var(--border)", background: "var(--bg-subtle)", color: "var(--text-2)" } : { borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-1)" };
  const linkFieldClass = "w-full rounded-lg border px-3 py-2 text-xs font-medium outline-none";
  const linkFieldStyle = locked ? { borderColor: "rgba(139,92,246,.25)", background: "rgba(139,92,246,.05)", color: "rgba(139,92,246,.6)" } : { borderColor: "rgba(139,92,246,.4)", background: "rgba(139,92,246,.08)", color: "#7c3aed" };

  const showRouteTimes = draft.serviceType === "Sightseeing Charter";
  const previewDropoffTime = addMinutesToTime(draft.waypoints.pickupTime, draft.routeDurationMins);
  const routeRows = [
    { badge: "Pick-up", tone: "green", name: draft.waypoints.pickup, meta: showRouteTimes ? `Pick-up Time ${draft.waypoints.pickupTime || "—"}` : "", pin: draft.waypoints.pickupMapLocation },
    ...draft.waypoints.stopovers.map((s, i) => ({ badge: `Stop ${i + 1}`, tone: "plain", name: s.location, meta: s.waitTime, pin: s.mapLocation })),
    { badge: "Drop-off", tone: "red", name: draft.waypoints.dropoff, meta: showRouteTimes ? `Drop-off Time ${previewDropoffTime ?? "—"}` : "", pin: draft.waypoints.dropoffMapLocation },
  ];

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center overflow-y-auto bg-black/50 p-2 sm:p-8">
      <div role="dialog" aria-modal="true" className="flex max-h-[calc(100vh-1rem)] w-full max-w-5xl flex-col overflow-hidden rounded-2xl shadow-2xl sm:max-h-[calc(100vh-2rem)]" style={{ background: "var(--bg-card)" }}>
        {/* Header */}
        <div className="flex items-start justify-between gap-4 border-b px-4 py-4 sm:px-6 sm:py-5" style={{ borderColor: "var(--border)" }}>
          <div className="flex min-w-0 flex-1 items-start gap-3">
            <span className="mono shrink-0 rounded-lg px-3 py-1 text-sm font-bold" style={{ background: "var(--bg-subtle)", color: "var(--text-1)" }}>{draft.id}</span>
            <div className="min-w-0 flex-1">
              <div className="flex flex-wrap items-center gap-3">
                <h2 className="truncate text-[17px] font-bold tracking-tight" style={{ color: "var(--text-1)" }}>{isNew ? "Create trip template" : draft.tripName || "Untitled template"}</h2>
                <button type="button" role="switch" aria-checked={draft.status === "active"} title="Toggle active status" onClick={toggleStatusNow}
                  className={`inline-flex items-center gap-2 rounded-full px-3 py-1 text-xs font-semibold transition hover:opacity-80 ${draft.status === "active" ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-500/15 dark:text-emerald-300" : "bg-gray-100 text-gray-600 dark:bg-white/10 dark:text-gray-300"}`}>
                  <span className={`h-2 w-2 rounded-full ${draft.status === "active" ? "bg-emerald-500" : "bg-gray-400"}`} />
                  {draft.status === "active" ? "Active" : "Inactive"}
                </button>
              </div>
              <p className="mt-0.5 truncate text-xs" style={{ color: "var(--text-3)" }}>
                {draft.serviceType === "Sightseeing Charter" && draft.officeLocation
                  ? `${draft.officeLocation} office · Sightseeing Charter${draft.durationTier ? ` · ${draft.durationTier} · start ${draft.waypoints.pickupTime}` : ""}`
                  : draft.serviceType === "Airport" && draft.officeLocation
                    ? `${draft.officeLocation} office · Airport transfer${draft.airport ? ` · ${airportDisplayName(draft.airport)}` : ""}`
                    : draft.serviceType === "Fixed Route" && draft.officeLocation
                      ? `${draft.officeLocation} office · Fixed Route`
                      : "Service type and office not set yet"}
              </p>
            </div>
          </div>
          <div className="flex shrink-0 items-center gap-2 sm:gap-3">
            <button type="button" onClick={onClose} className="rounded-lg p-1.5 transition hover:bg-black/5" style={{ color: "var(--text-3)" }}><IconX size={18} /></button>
          </div>
        </div>

        {/* Body */}
        <div className="grid min-h-0 flex-1 grid-cols-1 overflow-y-auto md:grid-cols-[340px_minmax(0,1fr)] md:overflow-hidden">
          {/* Left: Template panel */}
          <div className="flex flex-col gap-5 border-b p-4 sm:p-5 md:overflow-y-auto md:border-b-0 md:border-r" style={{ borderColor: "var(--border)", background: "var(--bg-subtle)" }}>
            <p className="text-[11px] font-bold uppercase tracking-wide" style={{ color: "var(--text-3)" }}>Template</p>

            <DebugField model="tour_templates" field="service_type">
              <div>
                <TTFieldLabel>Service Type</TTFieldLabel>
                <div className="flex flex-wrap gap-1.5">
                  {SERVICE_TYPES.map((type) => {
                    const selected = draft.serviceType === type;
                    const serviceTypeLocked = locked || !isNew;
                    return (
                      <button key={type} type="button" disabled={serviceTypeLocked} onClick={() => selectServiceType(type)}
                        title={!isNew ? "Service type can't be changed after a template is created" : undefined}
                        className={`rounded-lg border px-2.5 py-2 text-xs font-bold transition disabled:cursor-default ${selected ? serviceTypeBadgeClasses(type) + " border-transparent" : `${serviceTypeLocked ? "opacity-60" : "hover:bg-black/5"}`}`}
                        style={selected ? {} : { borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-2)" }}>
                        {type}
                      </button>
                    );
                  })}
                </div>
                {!isNew && <p className="mt-1.5 text-[11px]" style={{ color: "var(--text-3)" }}>Locked after creation — service type can't be changed on an existing template.</p>}
              </div>
            </DebugField>

            <DebugField model="tour_templates" field="trip_name">
              <div>
                <TTFieldLabel>Trip Name</TTFieldLabel>
                <input type="text" readOnly={locked} value={draft.tripName} onChange={(e) => update({ tripName: e.target.value })} onFocus={onFieldFocus} onBlur={onFieldBlur}
                  placeholder="e.g. Autumn Foliage & Deer Paths" className={fieldClass} style={fieldStyle} />
              </div>
            </DebugField>

            <DebugField model="tour_templates" field="office_id">
              <div>
                <TTFieldLabel>Office Location</TTFieldLabel>
                <div className="grid grid-cols-2 gap-1.5">
                  {OFFICE_LOCATIONS.map((loc) => (
                    <button key={loc} type="button" disabled={locked} onClick={() => selectOffice(loc)}
                      className={`rounded-lg border px-2.5 py-2 text-xs font-semibold transition disabled:cursor-default ${draft.officeLocation === loc ? "border-transparent bg-[#121621] text-white" : locked ? "opacity-60" : "hover:bg-black/5"}`}
                      style={draft.officeLocation === loc ? {} : { borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-2)" }}>
                      {loc}
                    </button>
                  ))}
                </div>
              </div>
            </DebugField>

            {draft.serviceType !== "Airport" && (
            <DebugField model="tour_templates" field="region">
              <div>
                <TTFieldLabel>Region</TTFieldLabel>
                <select value={draft.region ?? ""} disabled={locked} onChange={(e) => commit("Region changed", { region: e.target.value || null })}
                  className={`${fieldClass} disabled:cursor-default`} style={fieldStyle}>
                  <option value="" disabled>Select region…</option>
                  {regions.map((r) => <option key={r} value={r}>{r}</option>)}
                  {draft.region && !regions.includes(draft.region) && <option value={draft.region}>{draft.region}</option>}
                </select>
              </div>
            </DebugField>
            )}

            {draft.serviceType === "Airport" ? (
              draft.officeLocation && (
                <DebugField model="tour_templates" field="airport_code">
                  <div>
                    <TTFieldLabel>Airport</TTFieldLabel>
                    <div className="grid grid-cols-2 gap-1.5">
                      {OFFICE_AIRPORTS[draft.officeLocation].map((airport) => (
                        <button key={airport} type="button" disabled={locked} onClick={() => selectAirport(airport)}
                          className={`rounded-lg border px-2.5 py-2 text-center text-xs font-semibold transition disabled:cursor-default ${draft.airport === airport ? "border-transparent bg-[#121621] text-white" : locked ? "opacity-60" : "hover:bg-black/5"}`}
                          style={draft.airport === airport ? {} : { borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-2)" }}>
                          {airportDisplayName(airport)}
                        </button>
                      ))}
                    </div>
                  </div>
                </DebugField>
              )
            ) : draft.serviceType === "Sightseeing Charter" ? (
              <DebugField model="tour_templates" field="duration_tier">
                <div>
                  <TTFieldLabel>Duration Tier</TTFieldLabel>
                  <div className="grid grid-cols-2 gap-1.5">
                    {DURATION_TIERS.map((tier) => (
                      <button key={tier} type="button" disabled={locked} onClick={() => commit("Duration tier changed", withSuggestedPrice({ durationTier: tier }))}
                        className={`rounded-lg border px-2.5 py-2 text-center text-xs font-semibold transition disabled:cursor-default ${draft.durationTier === tier ? "border-transparent bg-[#121621] text-white" : locked ? "opacity-60" : "hover:bg-black/5"}`}
                        style={draft.durationTier === tier ? {} : { borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-2)" }}>
                        {tier}
                      </button>
                    ))}
                  </div>
                </div>
              </DebugField>
            ) : null}

            <div className="h-px" style={{ background: "var(--border)" }} />
            <p className="text-[11px] font-bold uppercase tracking-wide" style={{ color: "var(--text-3)" }}>Trip Totals</p>
            <div className="grid grid-cols-2 gap-2">
              <DebugField model="tour_templates" field="route_distance_km">
                <div className="rounded-lg border px-2.5 py-2" style={{ borderColor: "var(--border)", background: "var(--bg-card)" }}>
                  <p className="text-[11px]" style={{ color: "var(--text-3)" }}>Distance</p>
                  <p className="mt-0.5 text-sm font-bold tabular-nums" style={{ color: "var(--text-1)" }}>{draft.routeDistanceKm !== null ? `${draft.routeDistanceKm.toFixed(1)} km` : "--"}</p>
                </div>
              </DebugField>
              <DebugField model="tour_templates" field="route_duration_mins">
                <div className="rounded-lg border px-2.5 py-2" style={{ borderColor: "var(--border)", background: "var(--bg-card)" }}>
                  <p className="text-[11px]" style={{ color: "var(--text-3)" }}>Duration</p>
                  <p className="mt-0.5 text-sm font-bold tabular-nums" style={{ color: "var(--text-1)" }}>{draft.routeDurationMins !== null ? formatDuration(draft.routeDurationMins) : "--"}</p>
                </div>
              </DebugField>
            </div>
            <div className="grid grid-cols-2 gap-2">
              <DebugField model="tour_templates" field="trip_distance_km">
                <div>
                  <TTFieldLabel>Preset Distance (km)</TTFieldLabel>
                  <input type="number" min="0" step="0.1" readOnly={locked} value={draft.tripDistanceKm ?? ""} onChange={(e) => update({ tripDistanceKm: e.target.value ? parseFloat(e.target.value) : null })} onFocus={onFieldFocus} onBlur={onFieldBlur} placeholder="—" className={smallFieldClass} style={fieldStyle} />
                </div>
              </DebugField>
              <DebugField model="tour_templates" field="trip_duration_mins">
                <div>
                  <TTFieldLabel>Preset Duration (min)</TTFieldLabel>
                  <input type="number" min="0" step="5" readOnly={locked} value={draft.tripDurationMins ?? ""} onChange={(e) => update({ tripDurationMins: e.target.value ? parseInt(e.target.value, 10) : null })} onFocus={onFieldFocus} onBlur={onFieldBlur} placeholder="—" className={smallFieldClass} style={fieldStyle} />
                </div>
              </DebugField>
            </div>

            <div className="h-px" style={{ background: "var(--border)" }} />
            <p className="text-[11px] font-bold uppercase tracking-wide" style={{ color: "var(--text-3)" }}>Public Links</p>
            <div className="flex flex-col gap-2">
              <DebugField model="tour_templates" field="tour_details_url">
                <div>
                  <TTFieldLabel>Tour details page</TTFieldLabel>
                  <div className="flex items-center gap-1.5">
                    <input type="url" aria-label="Tour details URL" readOnly={locked} value={draft.previewLinks.tourDetails}
                      onChange={(e) => update({ previewLinks: { ...draft.previewLinks, tourDetails: e.target.value } })} onFocus={onFieldFocus} onBlur={onFieldBlur}
                      placeholder="https://www.zengoride.com/tours/..." className={linkFieldClass} style={linkFieldStyle} />
                    {!isNew && draft.previewLinks.tourDetails && (
                      <button type="button" title="Open tour details page" onClick={() => window.open(draft.previewLinks.tourDetails, "_blank", "noopener,noreferrer")}
                        className="shrink-0 rounded-lg border p-2 text-blue-500 transition hover:bg-blue-50 dark:hover:bg-blue-500/10" style={{ borderColor: "var(--border)", background: "var(--bg-card)" }}>
                        <IconGlobe size={16} />
                      </button>
                    )}
                  </div>
                </div>
              </DebugField>
              <DebugField model="tour_templates" field="tour_booking_url">
                <div>
                  <TTFieldLabel>Booking page</TTFieldLabel>
                  <div className="flex items-center gap-1.5">
                    <input type="url" aria-label="Booking URL" readOnly={locked} value={draft.previewLinks.tourBooking}
                      onChange={(e) => update({ previewLinks: { ...draft.previewLinks, tourBooking: e.target.value } })} onFocus={onFieldFocus} onBlur={onFieldBlur}
                      placeholder="/tours/your-slug/00001/2026-09-02" className={linkFieldClass} style={linkFieldStyle} />
                    {!isNew && draft.previewLinks.tourBooking && (
                      <button type="button" title="Preview booking page" onClick={() => onOpenBooking(draft)}
                        className="shrink-0 rounded-lg border p-2 text-violet-500 transition hover:bg-violet-50 dark:hover:bg-violet-500/10" style={{ borderColor: "var(--border)", background: "var(--bg-card)" }}>
                        <IconCalendarClock size={16} />
                      </button>
                    )}
                  </div>
                </div>
              </DebugField>
            </div>

          </div>

          {/* Right: Route + Vehicle Pricing */}
          <div className="flex flex-col gap-6 p-4 sm:p-5 md:overflow-y-auto">
            <div>
              <div className="mb-3.5 flex flex-wrap items-center justify-between gap-3">
                <p className="flex items-center gap-2 text-[11px] font-bold uppercase tracking-wide" style={{ color: "var(--text-3)" }}><IconMapPin size={14} />Route</p>
                <div className="flex flex-wrap items-center gap-2.5">
                  <p className="text-xs" style={{ color: "var(--text-3)" }}>
                    {wp.stopovers.length} stopover{wp.stopovers.length === 1 ? "" : "s"} · {draft.routeDistanceKm !== null ? `${draft.routeDistanceKm.toFixed(1)} km` : "--"} · {formatDuration(draft.routeDurationMins)}
                  </p>
                  <button type="button" onClick={() => setRouteMapOpen((v) => !v)}
                    className="inline-flex h-[30px] items-center gap-1.5 rounded-lg border px-3 text-xs font-semibold transition hover:bg-black/5"
                    style={routeMapOpen ? { borderColor: "#121621", background: "var(--bg-subtle)", color: "var(--text-1)" } : { borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-2)" }}>
                    {routeMapOpen ? "Hide map" : "Show map"}
                  </button>
                  {!routeEditing ? (
                    <button type="button" onClick={editRoute} disabled={locked} className="inline-flex h-[30px] items-center gap-1.5 rounded-lg border px-3 text-xs font-semibold transition hover:bg-black/5 disabled:cursor-not-allowed disabled:opacity-50" style={{ borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-2)" }}>
                      <IconPencil size={14} />Edit route
                    </button>
                  ) : (
                    <>
                      <button type="button" onClick={discardRoute} className="inline-flex h-[30px] items-center rounded-lg border px-3 text-xs font-medium transition hover:bg-black/5" style={{ borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-2)" }}>Discard</button>
                      <button type="button" onClick={applyRoute} className="inline-flex h-[30px] items-center gap-1.5 rounded-lg border border-[#121621] bg-[#121621] px-3 text-xs font-semibold text-white transition hover:bg-gray-800"><IconCheck size={14} />Set route</button>
                    </>
                  )}
                </div>
              </div>

              <div className="overflow-hidden rounded-xl border" style={{ borderColor: "var(--border)" }}>
                {!routeEditing ? (
                  routeRows.map((row, i) => (
                    <div key={row.badge} className={`grid grid-cols-[64px_minmax(0,1fr)_auto_24px] items-center gap-2 px-3 py-3 sm:grid-cols-[80px_minmax(0,1fr)_auto_28px] sm:gap-2.5 sm:px-3.5 ${i !== routeRows.length - 1 ? "border-b" : ""}`}
                      style={{ borderColor: "var(--border-soft)", background: row.tone !== "plain" ? "var(--bg-subtle)" : "transparent" }}>
                      {row.tone === "plain" ? (
                        <span className="text-xs font-semibold" style={{ color: "var(--text-3)" }}>{row.badge}</span>
                      ) : (
                        <span className={`inline-flex w-fit items-center justify-center rounded-md px-2 py-0.5 text-[11px] font-bold uppercase tracking-wide ${row.tone === "green" ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-500/15 dark:text-emerald-300" : "bg-red-100 text-red-800 dark:bg-red-500/15 dark:text-red-300"}`}>{row.badge}</span>
                      )}
                      <span className="truncate text-sm font-medium" style={{ color: "var(--text-1)" }}>{row.name || "—"}</span>
                      <span className="whitespace-nowrap text-xs tabular-nums" style={{ color: "var(--text-3)" }}>{row.meta}</span>
                      <IconMapPin size={16} className="justify-self-end" style={{ color: row.pin ? "#059669" : "var(--border)" }} />
                    </div>
                  ))
                ) : (
                  <>
                    <div className={`border-b p-3 ${EDIT_ROUTE_ROW_GRID}`} style={{ borderColor: "var(--border-soft)", background: "var(--bg-subtle)" }}>
                      <DebugField model="waypoints" field="pickup_text">
                        <div>
                          <TTFieldLabel>Pick-up Spot</TTFieldLabel>

                            <select value={draft.airport ?? ""} onChange={(e) => selectAirport(e.target.value)} className="w-full rounded-lg border px-3 py-2 text-sm outline-none focus:border-gray-400" style={{ borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-1)" }}>

                              {(OFFICE_AIRPORTS[draft.officeLocation] ?? Object.keys(AIRPORT_CODES)).map((a) => <option key={a} value={a}>{airportDisplayName(a)}</option>)}
                            </select>
                          ) : (
                            <input type="text" value={wp.pickup} onChange={(e) => updateRouteCopy({ pickup: e.target.value })} placeholder="Pick-up description" className="w-full rounded-lg border px-3 py-2 text-sm outline-none focus:border-gray-400" style={{ borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-1)" }} />
                          )}
                        </div>
                      </DebugField>
                      {draft.serviceType !== "Sightseeing Charter" ? <div aria-hidden="true" /> : (
                        <DebugField model="waypoints" field="pickup_time">
                          <div>
                            <TTFieldLabel>Pick-up Time</TTFieldLabel>
                            <input type="time" value={wp.pickupTime} onChange={(e) => updateRouteCopy({ pickupTime: e.target.value })} className="w-full rounded-lg border px-3 py-2 text-sm outline-none focus:border-gray-400" style={{ borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-1)" }} />
                          </div>
                        </DebugField>
                      )}
                      <MapLocationPicker theme="light" size="compact" label="Pick-up Spot" value={wp.pickupMapLocation ?? null} radiusEditable={draft.serviceType === "Fixed Route"} onChange={(loc) => updateRouteCopy({ pickupMapLocation: loc })} />
                      <div aria-hidden="true" className="hidden sm:block" />
                    </div>
                    {wp.stopovers.map((stop, i) => (
                      <div key={i} className={`border-b p-3 ${EDIT_ROUTE_ROW_GRID}`} style={{ borderColor: "var(--border-soft)" }}>
                        <input type="text" value={stop.location} onChange={(e) => { const arr = [...wp.stopovers]; arr[i] = { ...arr[i], location: e.target.value }; updateRouteCopy({ stopovers: arr }); }}
                          placeholder={`Stop ${i + 1} description`} className="w-full rounded-lg border px-3 py-2 text-sm outline-none focus:border-gray-400" style={{ borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-1)" }} />
                        <div>
                          <TTFieldLabel>Standby Time</TTFieldLabel>
                          <input type="time" value={stop.waitTime} onChange={(e) => { const arr = [...wp.stopovers]; arr[i] = { ...arr[i], waitTime: e.target.value }; updateRouteCopy({ stopovers: arr }); }}
                            aria-label={`Stop ${i + 1} wait time`} className="w-full rounded-lg border px-3 py-2 text-sm outline-none focus:border-gray-400" style={{ borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-1)" }} />
                        </div>
                        <MapLocationPicker theme="light" size="compact" label={`Stopover ${i + 1}`} value={stop.mapLocation ?? null} onChange={(loc) => { const arr = [...wp.stopovers]; arr[i] = { ...arr[i], mapLocation: loc }; updateRouteCopy({ stopovers: arr }); }} />
                        <button type="button" onClick={() => updateRouteCopy({ stopovers: wp.stopovers.filter((_, j) => j !== i) })} className="flex h-9 w-8 shrink-0 items-center justify-center rounded text-red-400 transition hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-500/10"><IconTrash size={16} /></button>
                      </div>
                    ))}
                    <div className="border-b p-3" style={{ borderColor: "var(--border-soft)" }}>
                      <button type="button" onClick={() => updateRouteCopy({ stopovers: [...wp.stopovers, { location: "", waitTime: "00:30", mapLocation: null }] })} className="inline-flex items-center gap-1 text-sm font-medium text-violet-600 transition hover:text-violet-800">
                        <IconPlus size={16} />Add stopover
                      </button>
                    </div>
                    <div className={`p-3 ${EDIT_ROUTE_ROW_GRID}`} style={{ background: "var(--bg-subtle)" }}>
                      <DebugField model="waypoints" field="dropoff_text">
                        <div>
                          <TTFieldLabel>Drop-off Spot</TTFieldLabel>
                          <input type="text" value={wp.dropoff} onChange={(e) => updateRouteCopy({ dropoff: e.target.value })} placeholder="Drop-off description" className="w-full rounded-lg border px-3 py-2 text-sm outline-none focus:border-gray-400" style={{ borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-1)" }} />
                        </div>
                      </DebugField>
                      {draft.serviceType !== "Sightseeing Charter" ? <div aria-hidden="true" /> : (
                        <div>
                          <TTFieldLabel>Drop-off Time</TTFieldLabel>
                          <p className="rounded-lg border px-3 py-2 text-sm" style={{ borderColor: "var(--border)", background: "var(--bg-subtle)", color: "var(--text-3)" }}>{addMinutesToTime(wp.pickupTime, draft.routeDurationMins) ?? "—"}</p>
                        </div>
                      )}
                      <MapLocationPicker theme="light" size="compact" label="Drop-off Spot" value={wp.dropoffMapLocation ?? null} onChange={(loc) => updateRouteCopy({ dropoffMapLocation: loc })} />
                      <div aria-hidden="true" className="hidden sm:block" />
                    </div>
                  </>
                )}
              </div>
              {routeMapOpen && <RouteMap waypoints={draft.waypoints} />}
            </div>

            {draft.serviceType === "Sightseeing Charter" ? (
              draft.officeLocation && draft.durationTier ? (
                <VehiclePricingTable officeLocation={draft.officeLocation} durationTier={draft.durationTier} pricing={draft.vehiclePricing} onChange={handleVehiclePricingChange} locked={locked} />
              ) : (
                <div className="rounded-xl border border-dashed p-5 text-center text-xs" style={{ borderColor: "var(--border)", background: "var(--bg-subtle)", color: "var(--text-3)" }}>Select an office and duration tier to see available vehicle pricing.</div>
              )
            ) : draft.serviceType === "Airport" ? (
              draft.officeLocation && draft.airport ? (
                <AirportVehiclePricingTable officeLocation={draft.officeLocation} airport={draft.airport} pricing={draft.airportVehiclePricing} onChange={handleAirportVehiclePricingChange} locked={locked} />
              ) : (
                <div className="rounded-xl border border-dashed p-5 text-center text-xs" style={{ borderColor: "var(--border)", background: "var(--bg-subtle)", color: "var(--text-3)" }}>Select an office and airport to see available vehicle pricing.</div>
              )
            ) : draft.serviceType === "Fixed Route" ? (
              draft.officeLocation ? (
                <FixedRouteVehiclePricingTable officeLocation={draft.officeLocation} pricing={draft.fixedRoutePricing} onChange={handleFixedRoutePricingChange} locked={locked} />
              ) : (
                <div className="rounded-xl border border-dashed p-5 text-center text-xs" style={{ borderColor: "var(--border)", background: "var(--bg-subtle)", color: "var(--text-3)" }}>Select an office to see available vehicle pricing.</div>
              )
            ) : (
              <div className="rounded-xl border border-dashed p-5 text-center text-xs" style={{ borderColor: "var(--border)", background: "var(--bg-subtle)", color: "var(--text-3)" }}>Select a service type to see available vehicle pricing.</div>
            )}
          </div>
        </div>

        {/* Footer */}
        <div className="flex flex-wrap items-center justify-between gap-3 border-t px-4 py-3 sm:gap-4 sm:px-6 sm:py-4" style={{ borderColor: "var(--border)", background: "var(--bg-subtle)" }}>
          <div className="flex items-center gap-3">
            <p className={`text-xs ${footerNoteClass}`} style={{ color: saveError ? undefined : "var(--text-3)" }}>{footerNote}</p>
            {!isNew && (
              <button type="button" title="Delete template" onClick={() => setDeleteConfirmOpen(true)} className="inline-flex items-center gap-1.5 rounded-lg px-2 py-1 text-xs font-medium transition hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-500/10" style={{ color: "var(--text-3)" }}>
                <IconTrash size={14} />Delete
              </button>
            )}
          </div>
          <div className="flex items-center gap-3">
            {mode === "edit" && (
              <button type="button" disabled={history.length === 0} title={history.length > 0 ? `Undo: ${history[history.length - 1].label}` : "Nothing to undo yet"} onClick={undo}
                className="inline-flex items-center gap-1.5 rounded-lg border px-3.5 py-2.5 text-sm font-medium transition hover:bg-black/5 disabled:cursor-not-allowed disabled:opacity-45" style={{ borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-2)" }}>
                <IconRefresh size={14} />Undo
              </button>
            )}
            <button type="button" onClick={cancelEdits} className="rounded-lg border px-5 py-2.5 text-sm font-medium transition hover:bg-black/5" style={{ borderColor: "var(--border)", color: "var(--text-2)" }}>{mode === "view" ? "Close" : "Cancel"}</button>
            {mode === "view" ? (
              <button type="button" onClick={enterEdit} className="inline-flex items-center gap-2 rounded-lg bg-[#FACC15] px-5 py-2.5 text-sm font-semibold text-[#121621] transition hover:bg-[#eab308]"><IconPencil size={14} />Edit template</button>
            ) : (
              <button type="button" disabled={!saveEnabled} onClick={handleSave} className="rounded-lg bg-[#FACC15] px-6 py-2.5 text-sm font-semibold text-[#121621] transition hover:bg-[#eab308] disabled:cursor-not-allowed disabled:opacity-45">{isNew ? "Create template" : "Save changes"}</button>
            )}
          </div>
        </div>
      </div>

      {deleteConfirmOpen && (
        <ConfirmDialog title="Delete this template?" description={`"${draft.tripName || "Untitled template"}" (${draft.id}) will be permanently removed from the catalog. This can't be undone.`}
          confirmLabel="Delete template" onCancel={() => setDeleteConfirmOpen(false)} onConfirm={() => { onDelete(tour.id); setDeleteConfirmOpen(false); }} />
      )}
    </div>
  );
}

/* ---------------- Pricing CMS ---------------- */
function OfficeFilterChips({ officeFilter, onChange, counts }) {
  return (
    <div className="flex flex-wrap gap-2">
      {OFFICE_LOCATIONS.map((office) => (
        <button key={office} type="button" onClick={() => onChange(office)}
          className={`rounded-full px-4 py-1.5 text-sm font-medium transition ${officeFilter === office ? "bg-[#121621] text-white" : "hover:bg-black/10"}`}
          style={officeFilter === office ? {} : { background: "var(--bg-subtle)", color: "var(--text-2)" }}>
          {office} ({counts[office]})
        </button>
      ))}
    </div>
  );
}
function OfficeModal({ draft: initial, onClose, onSave, onDelete }) {
  const [name, setName] = useState(initial.name);
  const canSave = name.trim().length > 0;
  return (
    <ModalShell title={initial.isNew ? "Add Office" : "Edit Office"} onClose={onClose}
      footer={(<>
        {onDelete && (
          <button type="button" onClick={onDelete} className="mr-auto inline-flex items-center gap-1.5 rounded-lg px-3 py-2 text-sm font-medium text-red-600 transition hover:bg-red-50">
            <IconTrash size={14} />Delete
          </button>
        )}
        <button type="button" onClick={onClose} className="rounded-lg border px-4 py-2 text-sm font-medium transition hover:bg-black/5" style={{ borderColor: "var(--border)", color: "var(--text-2)" }}>Cancel</button>
        <button type="button" disabled={!canSave} onClick={() => onSave({ name: name.trim() })}
          className="rounded-lg bg-[#FACC15] px-5 py-2 text-sm font-semibold text-[#121621] transition hover:bg-[#eab308] disabled:cursor-not-allowed disabled:opacity-45">Save</button>
      </>)}>
      <Field label="Office Name">
        <input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Fukuoka" className={fieldBox} style={{ borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-1)" }} />
      </Field>
    </ModalShell>
  );
}
function AirportModal({ airport: initial, onClose, onSave, onDelete }) {

  const [code, setCode] = useState(initial.code);
  const [office, setOffice] = useState(initial.office);

    <ModalShell title={initial.isNew ? "Add Airport" : "Edit Airport"} onClose={onClose}
      footer={(<>
        {onDelete && (
          <button type="button" onClick={onDelete} className="mr-auto inline-flex items-center gap-1.5 rounded-lg px-3 py-2 text-sm font-medium text-red-600 transition hover:bg-red-50">
            <IconTrash size={14} />Delete
          </button>
        )}
        <button type="button" onClick={onClose} className="rounded-lg border px-4 py-2 text-sm font-medium transition hover:bg-black/5" style={{ borderColor: "var(--border)", color: "var(--text-2)" }}>Cancel</button>
        <button type="button" disabled={!canSave} onClick={() => onSave({ name: name.trim(), code: code.trim().toUpperCase(), office })}
          className="rounded-lg bg-[#FACC15] px-5 py-2 text-sm font-semibold text-[#121621] transition hover:bg-[#eab308] disabled:cursor-not-allowed disabled:opacity-45">Save</button>
      </>)}>
      <Field label="Airport Name">
        <input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Narita Airport" className={fieldBox} style={{ borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-1)" }} />
      </Field>
      <Field label="Code">
        <input type="text" value={code} onChange={(e) => setCode(e.target.value)} placeholder="e.g. NRT" maxLength={4} className={`${fieldBox} mono uppercase max-w-[120px]`} style={{ borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-1)" }} />
      </Field>
      <Field label="Office">
        <div className="flex flex-wrap gap-1.5">
          {OFFICE_LOCATIONS.map((o) => (
            <button key={o} type="button" onClick={() => setOffice(o)} className={`rounded-full px-3 py-1.5 text-xs font-semibold transition ${office === o ? "bg-[#121621] text-white" : "hover:bg-black/10"}`} style={office === o ? {} : { background: "var(--bg-subtle)", color: "var(--text-2)" }}>{o}</button>
          ))}
        </div>
      </Field>
    </ModalShell>
  );
}
const PRICING_TABS = ["Tour Charters", "Airport Price", "Customized Price", "Offices", "Airport Management", "Vehicle Lineup"];

function PricingCMSView() {
  const [activeTab, setActiveTab] = useState("Tour Charters");
  const [rows, setRows] = useState(SIGHTSEEING_PRICE_SEED);
  const { airportRows, setAirportRows } = useContext(AirportPricingCtx);
  const [customRows, setCustomRows] = useState(CUSTOMIZED_PRICE_SEED);
  const [officeFilter, setOfficeFilter] = useState("Tokyo");
  const [editingAirportRow, setEditingAirportRow] = useState(null);
  const [editingSightseeingRow, setEditingSightseeingRow] = useState(null);
  const [editingCustomRow, setEditingCustomRow] = useState(null);
  const [officeList, setOfficeList] = useState(() => OFFICE_LOCATIONS.map((loc) => ({ name: loc })));
  const [editingOffice, setEditingOffice] = useState(null);
  const [vehicleLineup, setVehicleLineup] = useState(VEHICLE_LINEUP_SEED);
  const [editingVehicle, setEditingVehicle] = useState(null);
  const [airportLineup, setAirportLineup] = useState(AIRPORT_LINEUP_SEED);
  const [editingAirport, setEditingAirport] = useState(null);

  const sightseeingCounts = useMemo(() => officeCounts(rows), [rows]);
  const airportCounts = useMemo(() => officeCounts(airportRows), [airportRows]);
  const customCounts = useMemo(() => officeCounts(customRows), [customRows]);
  const vehicleLineupCounts = useMemo(() => officeCounts(vehicleLineup), [vehicleLineup]);
  const airportLineupCounts = useMemo(() => {
    const counts = { Tokyo: 0, Osaka: 0, Nagoya: 0, Sapporo: 0 };
    airportLineup.forEach((a) => { if (a.office in counts) counts[a.office]++; });
    return counts;
  }, [airportLineup]);

  const officeStats = useMemo(() => officeList.map((o) => {
    const tally = (list) => { const forOffice = list.filter((r) => (r.offices || []).includes(o.name)); return { active: forOffice.filter((r) => r.available).length, total: forOffice.length }; };
    return { office: o.name, tourCharters: tally(rows), airportTransfers: tally(airportRows), customizedPrice: tally(customRows) };
  }), [officeList, rows, airportRows, customRows]);

  const filteredSightseeing = rows.filter((r) => (r.offices || []).includes(officeFilter));
  const filteredAirport = airportRows.filter((r) => (r.offices || []).includes(officeFilter));
  const filteredCustom = customRows.filter((r) => (r.offices || []).includes(officeFilter));
  const filteredVehicleLineup = vehicleLineup.filter((v) => (v.offices || []).includes(officeFilter));
  const filteredAirportLineup = airportLineup.filter((a) => a.office === officeFilter);

  const handleRefresh = () => { setRows(SIGHTSEEING_PRICE_SEED); setAirportRows(AIRPORT_PRICE_SEED); setCustomRows(CUSTOMIZED_PRICE_SEED); setVehicleLineup(VEHICLE_LINEUP_SEED); setAirportLineup(AIRPORT_LINEUP_SEED); setOfficeFilter("Tokyo"); };

  const th = "px-4 py-3 text-xs font-semibold uppercase tracking-wide";
  return (
    <div className="flex flex-col gap-6">
      <div className="flex flex-wrap items-center justify-between gap-4">
        <h1 className="text-2xl font-bold" style={{ color: "var(--text-1)" }}>Pricing CMS</h1>
        <button type="button" onClick={handleRefresh} className="inline-flex h-9 items-center gap-1.5 rounded-lg border px-4 text-sm font-medium transition hover:bg-black/5" style={{ borderColor: "var(--border)", color: "var(--text-2)", background: "var(--bg-card)" }}>
          <IconRefresh size={16} /> Refresh
        </button>
      </div>

      <div className="flex flex-wrap gap-1 border-b" style={{ borderColor: "var(--border)" }}>
        {PRICING_TABS.map((tab) => (
          <button key={tab} type="button" onClick={() => setActiveTab(tab)}
            className="px-4 py-2.5 text-sm font-medium transition"
            style={activeTab === tab ? { borderBottom: "2px solid #FACC15", color: "var(--text-1)" } : { color: "var(--text-3)" }}>
            {tab}
          </button>
        ))}
      </div>

      {activeTab === "Tour Charters" ? (
        <>
          <OfficeFilterChips officeFilter={officeFilter} onChange={setOfficeFilter} counts={sightseeingCounts} />
          <div className="overflow-hidden rounded-xl border shadow-sm" style={{ borderColor: "var(--border)", background: "var(--bg-card)" }}>
            <table className="w-full text-left text-sm">
              <thead><tr className="border-b" style={{ borderColor: "var(--border-soft)", background: "var(--bg-subtle)" }}>
                {["Vehicle Name","Owner","Available","Half Day ¥","Full Day ¥","Action"].map((c) => <th key={c} className={th} style={{ color: "var(--text-3)" }}>{c}</th>)}
              </tr></thead>
              <tbody>
                {filteredSightseeing.map((row) => (
                  <tr key={row.id} onClick={() => setEditingSightseeingRow(row)} className="cursor-pointer border-b transition hover:bg-black/[0.03]" style={{ borderColor: "var(--border-soft)" }}>
                    <td className="px-4 py-3 font-medium" style={{ color: "var(--text-1)" }}>{row.vehicleName}</td>
                    <td className="px-4 py-3" style={{ color: "var(--text-2)" }}>{ownerForOffice(vehicleLineup, row.vehicleType, row.vehicleName, officeFilter) ?? row.owner}</td>
                    <td className="px-4 py-3" onClick={(e) => e.stopPropagation()}><Toggle available={row.available} onToggle={() => setRows((p) => p.map((r) => r.id === row.id ? { ...r, available: !r.available } : r))} /></td>
                    <td className="px-4 py-3 tabular-nums" style={{ color: "var(--text-1)" }}>{formatPrice(row.halfDayPrice)}</td>
                    <td className="px-4 py-3 tabular-nums" style={{ color: "var(--text-1)" }}>{formatPrice(row.fullDayPrice)}</td>
                    <td className="px-4 py-3"><button type="button" onClick={(e) => { e.stopPropagation(); setEditingSightseeingRow(row); }} className="rounded p-1.5 text-gray-400 transition hover:bg-black/5 hover:text-blue-600"><IconPencil size={16} /></button></td>

              </tbody>

          {editingSightseeingRow && (

            <table className="w-full min-w-[900px] text-left text-sm">
              <thead><tr className="border-b" style={{ borderColor: "var(--border-soft)", background: "var(--bg-subtle)" }}>

                                <span key={ri} className="whitespace-nowrap rounded-md border px-1.5 py-0.5 tabular-nums" style={{ borderColor: "var(--border-soft)", color: "var(--text-2)" }}>{r.name || `Range ${ri + 1}`} {formatPrice(r.fixedFee)}</span>

                    <td className="px-4 py-3 align-top" style={{ color: "var(--text-2)" }}>{ownerForOffice(vehicleLineup, row.vehicleType, row.vehicleName, officeFilter) ?? row.owner}</td>
                    <td className="px-4 py-3 align-top" onClick={(e) => e.stopPropagation()}><Toggle available={row.available} onToggle={() => setAirportRows((p) => p.map((r) => r.id === row.id ? { ...r, available: !r.available } : r))} /></td>
                    <td className="px-4 py-3 align-top"><button type="button" onClick={(e) => { e.stopPropagation(); setEditingAirportRow(row); }} className="rounded p-1.5 text-gray-400 transition hover:bg-black/5 hover:text-blue-600"><IconPencil size={16} /></button></td>
                  </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          {editingAirportRow && (
            <AirportPriceModal row={editingAirportRow} officeFilter={officeFilter} vehicleLineup={vehicleLineup} onClose={() => setEditingAirportRow(null)}
              onSave={(u) => { setAirportRows((p) => p.map((r) => r.id === u.id ? u : r)); setEditingAirportRow(null); }} />
          )}
        </>
      ) : activeTab === "Customized Price" ? (

const RANGE_MAP_COLORS = ["#10b981", "#3b82f6", "#f59e0b", "#ef4444", "#8b5cf6", "#ec4899", "#14b8a6"];
function RangeMapModal({ airport, ranges, onClose }) {
  const airportLoc = AIRPORT_MAP_LOCATIONS[airport] ?? { title: airport, address: "" };
  const maxRadius = Math.max(1, ...ranges.map((r) => r.radiusKm || 0));
  /* Largest range fills ~84% of the map height; other ranges scale linearly. Custom centers get a
   * deterministic offset from the airport pin since the prototype has no real coordinates. */
  const offsetFor = (center) => {
    if (!center || center.title === airportLoc.title) return { dx: 0, dy: 0 };
    let h = 0; for (let i = 0; i < center.title.length; i++) h = (h * 31 + center.title.charCodeAt(i)) % 9973;
    const angle = (h % 360) * Math.PI / 180;
    return { dx: Math.cos(angle) * 14, dy: Math.sin(angle) * 14 };
  };
  const sorted = ranges.map((r, i) => ({ ...r, color: RANGE_MAP_COLORS[i % RANGE_MAP_COLORS.length], index: i })).sort((a, b) => b.radiusKm - a.radiusKm);
  return (
    <div className="fixed inset-0 z-[110] flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm" onClick={onClose}>

function AirportPriceModal({ row, officeFilter, vehicleLineup, onClose, onSave }) {
  const [draft, setDraft] = useState(row);
  const [editingRange, setEditingRange] = useState(null);
  const [rangeMapAirport, setRangeMapAirport] = useState(null);
  const patch = (p) => setDraft((prev) => ({ ...prev, ...p }));
  const availableAirports = OFFICE_AIRPORTS[officeFilter] || [];
  /* Which airports an office serves is owned by OFFICE_AIRPORTS, not chosen
   * per-vehicle here — so every airport the current office serves
   * automatically gets a pricing leg (defaulting to zero) the first time
   * this vehicle's pricing is opened for that office. */
  useEffect(() => {
    setDraft((prev) => {
      const existing = new Set(prev.legs.map((l) => l.airport));
      const missing = availableAirports.filter((a) => !existing.has(a));
      if (missing.length === 0) return prev;
      return { ...prev, legs: [...prev.legs, ...missing.map((airport) => ({ airport, ranges: [{ name: "Standard", radiusKm: 15, fixedFee: 0, center: null }] }))] };
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);
  const patchLeg = (airport, fn) => setDraft((prev) => ({ ...prev, legs: prev.legs.map((l) => l.airport === airport ? fn(l) : l) }));
  const addRange = (airport) => patchLeg(airport, (l) => {
    const lastRadius = l.ranges[l.ranges.length - 1]?.radiusKm ?? 0;
    return { ...l, ranges: [...l.ranges, { name: "New range", radiusKm: lastRadius + 15, fixedFee: 0, center: null }] };
  });
  const setFee = (airport, index, fee) => patchLeg(airport, (l) => ({ ...l, ranges: l.ranges.map((r, i) => i === index ? { ...r, fixedFee: fee } : r) }));
  const updateRange = (airport, index, updated) => patchLeg(airport, (l) => ({ ...l, ranges: l.ranges.map((r, i) => i === index ? { ...r, ...updated } : r) }));
  const deleteRange = (airport, index) => patchLeg(airport, (l) => ({ ...l, ranges: l.ranges.filter((_, i) => i !== index) }));

  return (
    <ModalShell title="Edit Airport Transfer" onClose={onClose}
      footer={(<>
        <button type="button" onClick={onClose} className="rounded-lg border px-4 py-2 text-sm font-medium transition hover:bg-black/5" style={{ borderColor: "var(--border)", color: "var(--text-2)" }}>Cancel</button>
        <button type="button" onClick={() => onSave(draft)} className="rounded-lg bg-[#FACC15] px-5 py-2 text-sm font-semibold text-[#121621] transition hover:bg-[#eab308]">OK</button>
      </>)}>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Vehicle Type"><p className="rounded-lg border px-3 py-2 text-sm" style={{ borderColor: "var(--border)", background: "var(--bg-subtle)", color: "var(--text-3)" }}>{draft.vehicleType}</p></Field>
        <Field label="Vehicle Name"><p className="rounded-lg border px-3 py-2 text-sm" style={{ borderColor: "var(--border)", background: "var(--bg-subtle)", color: "var(--text-3)" }}>{draft.vehicleName}</p></Field>
      </div>
      <Field label="Owner">
        <div className="flex items-center gap-2">
          <span className="whitespace-nowrap rounded-md border px-2.5 py-1 text-xs font-medium" style={{ borderColor: "var(--border)", background: "var(--bg-subtle)", color: "var(--text-2)" }}>{ownerForOffice(vehicleLineup, draft.vehicleType, draft.vehicleName, officeFilter) ?? draft.owner}</span>
          <span className="text-xs" style={{ color: "var(--text-3)" }}>Read-only — set in the Vehicle Lineup tab.</span>
        </div>
      </Field>
      <div className="flex items-center justify-between"><p className={fieldLabel} style={{ color: "var(--text-3)" }}>Available</p><Toggle available={draft.available} onToggle={() => patch({ available: !draft.available })} /></div>
      {draft.legs.filter((l) => availableAirports.includes(l.airport)).length > 0 && (
        <Field label="Pricing Map">
          <div className="flex flex-col gap-3">
            {draft.legs.filter((l) => availableAirports.includes(l.airport)).map((leg) => (
              <div key={leg.airport} className="rounded-lg border p-2.5" style={{ borderColor: "var(--border)" }}>
                <div className="flex items-center justify-between">
                  <p className="text-sm font-bold" style={{ color: "var(--text-1)" }}>{leg.airport} <span className="text-xs font-normal" style={{ color: "var(--text-3)" }}>({AIRPORT_CODES[leg.airport]})</span></p>
                  <div className="flex items-center gap-1.5">
                    <button type="button" onClick={() => setRangeMapAirport(leg.airport)}
                      className="inline-flex items-center gap-1 rounded-lg border px-2.5 py-1 text-xs font-medium transition hover:bg-black/5" style={{ borderColor: "var(--border)", color: "var(--text-2)" }}>
                      <IconMap size={12} />Range map
                    </button>
                    <button type="button" onClick={() => addRange(leg.airport)}
                      className="inline-flex items-center gap-1 rounded-lg border px-2.5 py-1 text-xs font-medium transition hover:bg-black/5" style={{ borderColor: "var(--border)", color: "var(--text-2)" }}>
                      <IconPlus size={12} />Add range
                    </button>
                  </div>
                </div>
                {leg.ranges.length > 0 && (
                  <div className="mt-2.5 grid grid-cols-[1fr_110px_120px] gap-2 px-0.5 text-[10px] font-bold uppercase tracking-wider" style={{ color: "var(--text-3)" }}>
                    <span>Fixed Range Name</span><span>Fixed Fee ¥</span><span>Fix Rate Range</span>
                  </div>
                )}
                <div className="mt-1 flex flex-col gap-1.5">
                  {leg.ranges.map((r, i) => (
                    <div key={i} className="grid grid-cols-[1fr_110px_120px] items-center gap-2">
                      <button type="button" onClick={() => setEditingRange({ airport: leg.airport, index: i })}
                        className="truncate rounded-lg border px-3 py-1.5 text-left text-sm outline-none transition hover:border-gray-400" style={{ borderColor: "var(--border)", background: "var(--bg-subtle)", color: "var(--text-1)" }}>
                        {r.name || "Unnamed range"}
                      </button>
                      <input type="number" min="0" value={r.fixedFee} onChange={(e) => setFee(leg.airport, i, parseInt(e.target.value,10)||0)}
                        className="w-full min-w-0 rounded-lg border px-2 py-1.5 text-sm tabular-nums outline-none focus:border-gray-400" style={{ borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-1)" }} />
                      <button type="button" onClick={() => setEditingRange({ airport: leg.airport, index: i })}
                        className="flex items-center justify-between gap-1 rounded-lg border px-2.5 py-1.5 text-sm outline-none transition hover:border-gray-400" style={{ borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-1)" }}>
                        {r.radiusKm} km<IconMapPin size={13} className="shrink-0" style={{ color: "var(--text-3)" }} />
                      </button>
                    </div>
                  ))}
                  {leg.ranges.length === 0 && <p className="rounded-lg border border-dashed px-3 py-2.5 text-center text-xs" style={{ borderColor: "var(--border)", color: "var(--text-3)" }}>No ranges configured — add one.</p>}
                </div>
              </div>
            ))}
          </div>
        </Field>
      )}
      {editingRange && (
        <RangeEditorModal airport={editingRange.airport}
          range={draft.legs.find((l) => l.airport === editingRange.airport).ranges[editingRange.index]}
          onClose={() => setEditingRange(null)}
          onSave={(updated) => { updateRange(editingRange.airport, editingRange.index, updated); setEditingRange(null); }}
          onDelete={() => { deleteRange(editingRange.airport, editingRange.index); setEditingRange(null); }} />
      )}
      {rangeMapAirport && (
        <RangeMapModal airport={rangeMapAirport} ranges={draft.legs.find((l) => l.airport === rangeMapAirport)?.ranges ?? []} onClose={() => setRangeMapAirport(null)} />
      )}
    </ModalShell>
  );
}

const AUTUMN_FOLIAGE_DEMO_ITINERARY = {
  slug: "autumn-foliage-deer-paths", tripName: "Autumn Foliage & Deer Paths",
  pickup: "THE OSAKA STATION HOTEL, Autograph Collection", dropoff: "THE OSAKA STATION HOTEL, Autograph Collection",
  stopovers: [{ location: "Tōdai-ji", waitTime: "3h" }, { location: "Mount Wakakusa", waitTime: "None" }],
  defaultTime: "09:00", tripDistanceKm: 80.1, drivingMins: 118, waitingMins: 180, totalMins: 298,
};
function parseWaitMins(waitTime) {
  if (!waitTime || waitTime.toLowerCase() === "none") return 0;
  const hhmm = waitTime.match(/^(\d{1,2}):(\d{2})$/);
  if (hhmm) return parseInt(hhmm[1], 10) * 60 + parseInt(hhmm[2], 10);
  const hourMatch = waitTime.match(/(\d+)\s*h/i);
  const minMatch = waitTime.match(/(\d+)\s*min/i);
  return (hourMatch ? parseInt(hourMatch[1], 10) * 60 : 0) + (minMatch ? parseInt(minMatch[1], 10) : 0);
}
function buildItineraryFromTour(tour) {
  const slug = slugifyTripName(tour.tripName);
  if (slug === "autumn-foliage-deer-paths") return AUTUMN_FOLIAGE_DEMO_ITINERARY;
  const waitingMins = tour.waypoints.stopovers.reduce((sum, s) => sum + parseWaitMins(s.waitTime), 0);
  const totalMins = tour.tripDurationMins ?? tour.routeDurationMins ?? 0;
  const drivingMins = Math.max(totalMins - waitingMins, 0);
  return {
    slug, tripName: tour.tripName, pickup: tour.waypoints.pickup, dropoff: tour.waypoints.dropoff,
    stopovers: tour.waypoints.stopovers.map((s) => ({ location: s.location, waitTime: s.waitTime || "None" })),
    defaultTime: tour.waypoints.pickupTime, tripDistanceKm: tour.tripDistanceKm ?? tour.routeDistanceKm ?? 0,
    drivingMins, waitingMins, totalMins,
  };
}
function formatDurationLabel(mins) {
  const h = Math.floor(mins / 60); const m = mins % 60;
  if (h === 0) return `${m}mins`;
  if (m === 0) return `${h}hrs`;
  return `${h}hrs ${m}mins`;
}

const ZG_GRADIENT = "linear-gradient(45deg, #F33232 19.53%, #F4A639 76.43%)";

  const today = new Date();
  const parsed = value ? new Date(value + "T00:00:00") : null;
  const [viewYear, setViewYear] = useState((parsed || today).getFullYear());
  const [viewMonth, setViewMonth] = useState((parsed || today).getMonth());

  const SEG_ORDER = ["yyyy", "mm", "dd"];
  const SEG_LEN = { yyyy: 4, mm: 2, dd: 2 };
  const valueParts = {
    yyyy: parsed ? String(parsed.getFullYear()) : "",
    mm: parsed ? String(parsed.getMonth() + 1).padStart(2, "0") : "",
    dd: parsed ? String(parsed.getDate()).padStart(2, "0") : "",
  };
  const [parts, setParts] = useState(valueParts);
  useEffect(() => { if (activeSeg === null) setParts(valueParts); }, [value, activeSeg]);

  useEffect(() => {
    if (!open && activeSeg === null) return;
    const onDown = (e) => {
      if (ref.current && !ref.current.contains(e.target)) { setOpen(false); if (activeSeg !== null) { finalizeParts(parts); setActiveSeg(null); } }
    };
    document.addEventListener("mousedown", onDown);
    return () => document.removeEventListener("mousedown", onDown);
  }, [open, activeSeg, parts]);

  useEffect(() => { if (activeSeg) segRefs.current[activeSeg]?.focus(); }, [activeSeg]);

  const monthLabel = new Date(viewYear, viewMonth, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  const fmt = (y, m, d) => `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  const isSelected = (d) => parsed && parsed.getFullYear() === viewYear && parsed.getMonth() === viewMonth && parsed.getDate() === d;
  const isToday = (d) => today.getFullYear() === viewYear && today.getMonth() === viewMonth && today.getDate() === d;
  const prevMonth = () => { if (viewMonth === 0) { setViewMonth(11); setViewYear((y) => y - 1); } else setViewMonth((m) => m - 1); };
  const nextMonth = () => { if (viewMonth === 11) { setViewMonth(0); setViewYear((y) => y + 1); } else setViewMonth((m) => m + 1); };
  const nextSegOf = (seg) => SEG_ORDER[SEG_ORDER.indexOf(seg) + 1] || null;
  const prevSegOf = (seg) => SEG_ORDER[SEG_ORDER.indexOf(seg) - 1] || null;

  const [confirmedEnds, setConfirmedEnds] = useState({ pickup: false, dropoff: false });
  /* Charter only: when on, the End Spot mirrors the Start Spot (round trip). */
  const [sameAsStart, setSameAsStart] = useState(false);
  const [region, setRegion] = useState("All");
  const { regions } = useContext(RegionsCtx);
  const visibleTemplates = mode === "charter" && region !== "All" ? templates.filter((t) => regionOfTour(t) === region) : templates;
  const changeRegion = (r) => {
    setRegion(r);
    const list = r === "All" ? templates : templates.filter((t) => regionOfTour(t) === r);
    if (list.length && !list.some((t) => t.id === selectedId)) setSelectedId(list[0].id);
  };
  /* Frequently Used Routes scrolls sideways with no scrollbar: vertical mouse wheel is mapped to horizontal
   * scroll, and the row can be dragged with the mouse (a drag doesn't count as a click on a route). */
  const routesRowRef = useRef(null);
  const routesDragRef = useRef({ active: false, startX: 0, startScroll: 0, moved: false });
  useEffect(() => {
    const el = routesRowRef.current;
    if (!el) return;
    const onWheel = (e) => {
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX) || el.scrollWidth <= el.clientWidth) return;
      e.preventDefault();
      el.scrollLeft += e.deltaY;
    };
    el.addEventListener("wheel", onWheel, { passive: false });
    return () => el.removeEventListener("wheel", onWheel);
  }, [tour?.id]);

  /* Start from the selected template's Catalog route, deriving the From/To Airport direction from which
   * end holds the template's airport. Edits here are for the current order only and never written back
   * to the Catalog template. */
  useEffect(() => {
    if (!tour) { setDraftWaypoints(null); return; }
    setDraftWaypoints(structuredClone(tour.waypoints));
    const d = mode === "airport" ? deriveAirportDirection(tour) : { direction: null, from: null, to: null };
    setDirection(d.direction);
    setFromAirport(d.from);
    setToAirport(d.to);
    setConfirmedEnds({ pickup: false, dropoff: false });
    setSameAsStart(mode === "charter" && !!tour.waypoints.pickup && tour.waypoints.pickup === tour.waypoints.dropoff);
    setExpanded(null);
  }, [tour?.id, tour?.waypoints, tour?.airport]);

  const backRow = (
    <div className="mx-[10%] flex flex-wrap items-center justify-between gap-3">
      <button type="button" onClick={onBack}
        className="inline-flex h-9 items-center gap-1.5 rounded-full border border-white/60 bg-white/70 pl-2.5 pr-4 text-sm font-semibold shadow-sm backdrop-blur transition hover:bg-white" style={{ color: "#3b1e0e" }}>
        <IconChevronLeft size={16} />Back To My Trips
      </button>
    </div>
  );

  if (!tour || !draftWaypoints) {
    return (<>
      {backRow}
      {tabBar}
      <div className="mx-[10%] mt-4 flex min-h-[40vh] flex-col items-center justify-center rounded-[32px] border border-white/50 p-10 text-center shadow-xl" style={{ background: "rgba(255,255,255,0.35)", backdropFilter: "blur(20px)", WebkitBackdropFilter: "blur(20px)" }}>

      </div>
    </>);
  }

  const patch = (p) => setDraftWaypoints((prev) => ({ ...prev, ...p }));
  const handleFromAirportChange = (airport) => {
    setFromAirport(airport);
    patch({ pickup: airportDisplayName(airport), pickupMapLocation: AIRPORT_MAP_LOCATIONS[airport] ?? null });
  };
  const handleToAirportChange = (airport) => {
    setToAirport(airport);
    patch({ dropoff: airportDisplayName(airport), dropoffMapLocation: AIRPORT_MAP_LOCATIONS[airport] ?? null });
  };
  const handleSwitchAirportDir = (dir) => {
    setDirection(dir);
    if (dir === "from") { setToAirport(null); patch({ dropoff: "", dropoffMapLocation: null }); }
    if (dir === "to") { setFromAirport(null); patch({ pickup: "", pickupMapLocation: null }); }
  };
  const handleReverse = () => {
    setDraftWaypoints((prev) => ({ ...prev, pickup: prev.dropoff, pickupMapLocation: prev.dropoffMapLocation ?? null, dropoff: prev.pickup, dropoffMapLocation: prev.pickupMapLocation ?? null, stopovers: [...prev.stopovers].reverse() }));
    setFromAirport(toAirport);
    setToAirport(fromAirport);
    setDirection((d) => (d === "from" ? "to" : d === "to" ? "from" : d));
    setConfirmedEnds((c) => ({ pickup: c.dropoff, dropoff: c.pickup }));
    setExpanded(null);
  };
  const patchStop = (i, p) => setDraftWaypoints((prev) => ({ ...prev, stopovers: prev.stopovers.map((s, j) => (j === i ? { ...s, ...p } : s)) }));
  const removeStop = (i) => setDraftWaypoints((prev) => ({ ...prev, stopovers: prev.stopovers.filter((_, j) => j !== i) }));

  const liveMetrics = estimateRouteMetrics(draftWaypoints);
  /* Charter durations include standby at stops, so the Catalog template's total is authoritative there. */
  const routeDurationMins = mode === "charter" ? (tour.routeDurationMins ?? liveMetrics?.durationMins) : (liveMetrics?.durationMins ?? tour.routeDurationMins);
  const routeDistanceKm = mode === "charter" ? (tour.routeDistanceKm ?? liveMetrics?.distanceKm) : (liveMetrics?.distanceKm ?? tour.routeDistanceKm);
  const rows = itinRowsFromWaypoints(draftWaypoints, direction, addMinutesToTime(draftWaypoints.pickupTime, routeDurationMins), mode);

  const handleSave = () => {
    setSavedFlash(true);
    setTimeout(() => setSavedFlash(false), 1800);
  };


  return (<>
      {backRow}
      {tabBar}
      <div className="mx-[10%] mt-4 rounded-2xl border border-white/50 px-4 py-3.5 shadow-sm sm:px-5" style={{ background: "rgba(255,255,255,0.45)", backdropFilter: "blur(16px)", WebkitBackdropFilter: "blur(16px)" }}>

          onPointerMove={(e) => { const d = routesDragRef.current; if (!d.active) return; const dx = e.clientX - d.startX; if (Math.abs(dx) > 4) d.moved = true; e.currentTarget.scrollLeft = d.startScroll - dx; }}
          onPointerUp={() => { routesDragRef.current.active = false; }}
          onPointerLeave={() => { routesDragRef.current.active = false; }}

            {rows.map((row, i) => {

              /* Start/end are edited inline (airport dropdown or location modal) and the pick-up time only via the
               * top Pick-up Time picker, so only stopovers expand. */
              const expandable = row.key.startsWith("stop-");
              const airportRow = (row.key === "pickup" && direction === "from") || (row.key === "dropoff" && direction === "to");
              const isOpen = expandable && expanded === row.key;
              const isStop = row.key.startsWith("stop-");
              /* Start/end text lines up with the text inside the airport dropdown (its px-3 padding). */
