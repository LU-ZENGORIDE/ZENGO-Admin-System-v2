              /* A fixed-route template only names the area (e.g. "Tokyo (23 Wards)") for the non-airport end;
               * until a real address is pinned, show it muted with a prompt to enter one. */
              const mirrorsStart = mode === "charter" && row.key === "dropoff" && sameAsStart;
              const needsExactAddress = mode === "charter"
                ? !isStop && !mirrorsStart && !!row.name && !confirmedEnds[row.key]
                : !isStop && !airportRow && !!direction && !!row.name && !row.mapLocation;
              const stopIndex = isStop ? Number(row.key.split("-")[1]) : null;
              return (
                <div key={row.key} className={i !== rows.length - 1 ? "border-b border-gray-100" : ""}>
                  <div role={expandable ? "button" : undefined} tabIndex={expandable ? 0 : undefined}
                    onClick={() => expandable && setExpanded(isOpen ? null : row.key)}
                    onKeyDown={(e) => { if (expandable && (e.key === "Enter" || e.key === " ") && e.target === e.currentTarget) { e.preventDefault(); setExpanded(isOpen ? null : row.key); } }}
                    className={`flex w-full items-center gap-3 px-4 text-left transition sm:gap-4 sm:px-5 ${isStop ? "py-3.5" : "min-h-[88px] py-5"} ${expandable ? "cursor-pointer hover:bg-gray-50/80" : ""}`}>
                    {isStop ? (
                      <>
                        <span className="flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-xs font-extrabold text-white" style={{ background: color }}>{i + 1}</span>
                        <span className="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-gray-100 text-gray-500"><row.icon size={16} /></span>
                      </>
                    ) : (
                      <span className="flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-white" style={{ background: color }}><row.icon size={15} /></span>
                    )}
                    <div className={`flex min-w-0 flex-1 flex-col ${isStop ? "gap-1" : "gap-2"}`}>
                      {airportRow ? (
                        <AirportSelect value={row.key === "pickup" ? fromAirport : toAirport}

                      ) : mirrorsStart ? (

                          <IconMapPin size={15} className="shrink-0 text-gray-300" />

                      ) : !isStop ? (
                        <div onClick={(e) => e.stopPropagation()} onKeyDown={(e) => e.stopPropagation()}>
                          <MapLocationPicker theme="light" size="field" label={row.label} placeholder="Please input a location."
                            muted={needsExactAddress}
                            value={row.mapLocation ?? (row.name ? { title: row.name, address: "" } : null)}
                            onChange={(loc) => {
                              const mirror = mode === "charter" && sameAsStart && row.key === "pickup";
                              patch(row.key === "pickup" ? { pickup: loc.title, pickupMapLocation: loc, ...(mirror ? { dropoff: loc.title, dropoffMapLocation: loc } : {}) } : { dropoff: loc.title, dropoffMapLocation: loc });
                              setConfirmedEnds((c) => ({ ...c, [row.key]: true, ...(mirror ? { dropoff: true } : {}) }));
                            }} />
                        </div>
                      ) : (
                        <span className={`block truncate text-[15px] font-bold text-gray-900 ${alignIndent}`}>{row.name || "Not set"}</span>
                      )}
                      {mode === "charter" && row.key === "dropoff" && (
                        <label className="inline-flex w-fit cursor-pointer select-none items-center gap-2 pl-1 text-[13px] font-medium text-gray-600">
                          <input type="checkbox" checked={sameAsStart} className="h-4 w-4 cursor-pointer accent-orange-500"
                            onChange={(e) => {
                              const on = e.target.checked;
                              setSameAsStart(on);
                              if (on) {
                                patch({ dropoff: draftWaypoints.pickup, dropoffMapLocation: draftWaypoints.pickupMapLocation ?? null });
                                setConfirmedEnds((c) => ({ ...c, dropoff: c.pickup }));
                              }
                            }} />
                          Same as Start Spot
                        </label>
                      )}
                      {needsExactAddress && (
                        <span className="block pl-1 text-[12px] font-medium text-red-500">
                          {row.key === "pickup" ? "Please enter your pickup location." : "Please enter your drop-off location."}
                        </span>
                      )}
                      {row.meta && <span className={`block truncate text-[13px] text-gray-500 ${alignIndent}`}>{row.meta}</span>}
                    </div>
                    <span className="hidden shrink-0 items-center gap-1.5 rounded-full bg-gray-50 px-2.5 py-1 text-xs font-semibold sm:inline-flex" style={{ color }}>
                      {row.label}
                    </span>
                    {expandable ? <IconChevronRight size={16} className={`shrink-0 text-gray-300 transition-transform ${isOpen ? "rotate-90" : ""}`} /> : <span className="w-4 shrink-0" aria-hidden="true" />}
                  </div>
                  {isOpen && (
                    <div className="flex flex-col gap-3 border-t border-gray-100 bg-gray-50/60 px-4 py-4 sm:px-5">
                      {isStop && (
                      <div>
                        <label className="mb-1 block text-[11px] font-semibold uppercase tracking-wide text-gray-400">Location</label>
                        <MapLocationPicker theme="light" size="field" label={row.label} value={row.mapLocation}
                          onChange={(loc) => patchStop(stopIndex, { location: loc.title, mapLocation: loc })} />
                      </div>
                      )}
                      {isStop && (
                        <div className="flex items-end gap-3">
                          <div className="max-w-[160px] flex-1">
                            <label className="mb-1 block text-[11px] font-semibold uppercase tracking-wide text-gray-400">Standby time</label>
                            <input type="text" value={draftWaypoints.stopovers[stopIndex].waitTime} onChange={(e) => patchStop(stopIndex, { waitTime: e.target.value })} className="w-full rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm outline-none focus:border-gray-400" />
                          </div>
                          <button type="button" onClick={() => { removeStop(stopIndex); setExpanded(null); }} className="inline-flex h-9 items-center gap-1.5 rounded-lg border border-red-100 px-3 text-xs font-semibold text-red-600 transition hover:bg-red-50">
                            <IconTrash size={13} />Remove stop
                          </button>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          <button type="button" onClick={handleSave}
            className="inline-flex h-12 w-full items-center justify-center gap-2 rounded-2xl text-[15px] font-bold text-white shadow-md transition hover:opacity-90 hover:shadow-lg"
            style={{ background: ZG_GRADIENT }}>
            <IconCart size={17} />Add To Cart
          </button>
          {savedFlash && <p className="text-center text-xs font-semibold text-emerald-700">Added to cart — the Catalog template is unchanged.</p>}
          </div>

          {/* Right column: map */}
        <div className="flex flex-col gap-3 lg:sticky lg:top-6">
          <div className="relative">
            <ItinItineraryMap rows={rows} zoom={zoom} />
            <div className="absolute bottom-4 right-4 flex flex-col overflow-hidden rounded-xl bg-white shadow-lg">
              <button type="button" onClick={() => setZoom((z) => Math.min(1.6, +(z + 0.2).toFixed(1)))} className="flex h-9 w-9 items-center justify-center text-gray-600 transition hover:bg-gray-50"><IconPlus size={15} /></button>
              <div className="h-px bg-gray-100" />
              <button type="button" onClick={() => setZoom((z) => Math.max(0.8, +(z - 0.2).toFixed(1)))} className="flex h-9 w-9 items-center justify-center text-gray-600 transition hover:bg-gray-50"><IconMinus size={15} /></button>
            </div>
          </div>
          <p className="px-1 text-center text-xs" style={{ color: "rgba(59,30,14,0.4)" }}>Schematic preview · pins are placed for readability, not to scale</p>
        </div>
        </div>
      </div>
    </>);
}

function createEmptyTour() {
  return {
    id: "-----", reference: "-----", tripName: "", officeLocation: null, region: null, durationTier: null, status: "inactive", price: null, startTime: "09:00",
    viewedCount: 0, bookedCount: 0, serviceType: null, airport: null,
    userName: null, userEmail: null, userSource: null, paymentStatus: null, passengers: null, luggage: null,
    driverName: null, plateNumber: null, useDefaultPrice: true, vehiclePricing: null, airportVehiclePricing: null, fixedRoutePricing: null,
    waypoints: emptyWaypoints(), routeDistanceKm: null, routeDurationMins: null, tripDistanceKm: null, tripDurationMins: null,
    previewLinks: { tourDetails: "https://www.zengoride.com/tours/new-tour", tourBooking: "https://exert-hula-resilient.ngrok-free.dev/tours/new-tour/0001/2026-09-02" },
  };
}
function generateNextId(tours, serviceType, office) {
  if (serviceType === "Airport") {
    const nums = tours.map((t) => { const m = t.id.match(/^#A(\d{4})/); return m ? parseInt(m[1],10) : 0; }).filter((n) => n>0);
    const next = nums.length ? Math.max(...nums)+1 : 1;
    return `#A${String(next).padStart(4,"0")}${(office||"T")[0].toUpperCase()}`;
  }
  if (serviceType === "Fixed Route") {
    const nums = tours.map((t) => { const m = t.id.match(/^#F(\d{4})/); return m ? parseInt(m[1],10) : 0; }).filter((n) => n>0);
    const next = nums.length ? Math.max(...nums)+1 : 1;
    return `#F${String(next).padStart(4,"0")}${(office||"T")[0].toUpperCase()}`;
  }
  const nums = tours.map((t) => { const m = t.id.match(/#T(\d{4})A/); return m ? parseInt(m[1],10) : 0; }).filter((n) => n>0);
  const next = nums.length ? Math.max(...nums)+1 : 1;
  return `#T${String(next).padStart(4,"0")}A`;
}

function AdminShell() {
  const [systemView, setSystemView] = useState("admin");
  const [activeView, setActiveView] = useState("tour-catalog");
  const [tours, setTours] = useState(SEED_TOURS);
  const [regions, setRegions] = useState(CHARTER_REGIONS);
  /* edits: [{ original: string|null, name }] — renames carry over to templates using the old name. */
  const saveRegions = useCallback((edits) => {
    setRegions(edits.map((e) => e.name));
    const renames = Object.fromEntries(edits.filter((e) => e.original && e.original !== e.name).map((e) => [e.original, e.name]));
    if (Object.keys(renames).length) setTours((prev) => prev.map((t) => (t.region && renames[t.region] ? { ...t, region: renames[t.region] } : t)));
  }, []);
  const regionsValue = useMemo(() => ({ regions, saveRegions }), [regions, saveRegions]);
  const [modalTour, setModalTour] = useState(null);
  const [isNewTour, setIsNewTour] = useState(false);
  const [debugMode, setDebugMode] = useState(false);
  const [airportRows, setAirportRows] = useState(AIRPORT_PRICE_SEED);
  const airportPricingValue = useMemo(() => ({ airportRows, setAirportRows }), [airportRows]);
  const [bookingPreviewTour, setBookingPreviewTour] = useState(null);
  const bookingItinerary = useMemo(() => (bookingPreviewTour ? buildItineraryFromTour(bookingPreviewTour) : null), [bookingPreviewTour]);
  const openBooking = useCallback((tour) => setBookingPreviewTour(tour), []);

  const openEdit = useCallback((id) => { const t = tours.find((x) => x.id === id); if (t) { setModalTour(t); setIsNewTour(false); } }, [tours]);
  const openAdd = useCallback(() => { setModalTour(createEmptyTour()); setIsNewTour(true); }, []);
  const handleToggleStatus = useCallback((id) => setTours((prev) => prev.map((t) => t.id === id ? { ...t, status: t.status === "active" ? "inactive" : "active" } : t)), []);
  const handleDelete = useCallback((id) => { setTours((prev) => prev.filter((t) => t.id !== id)); setModalTour((prev) => prev && prev.id === id ? null : prev); }, []);
  const handleSave = useCallback((saved) => {
    if (isNewTour) {
      const newId = generateNextId(tours, saved.serviceType, saved.officeLocation);
      const finalized = { ...saved, id: newId };
      setTours((prev) => [...prev, finalized]);
      setModalTour(null);
    } else {
      setTours((prev) => prev.map((t) => t.id === saved.id ? saved : t));
      setModalTour(null);
    }
    setIsNewTour(false);
  }, [tours, isNewTour]);
  const handleRefresh = useCallback(() => setTours(SEED_TOURS), []);

  const viewTitles = { orders: "Orders", "dispatch-board": "Dispatch Board" };

  return (
    <DebugCtx.Provider value={{ debugMode, toggle: () => setDebugMode((v) => !v) }}>
      <AirportPricingCtx.Provider value={airportPricingValue}>
      <RegionsCtx.Provider value={regionsValue}>
      <div className="min-h-screen" style={{ background: "var(--bg-app)" }}>
        <Sidebar activeView={activeView} onNavigate={setActiveView} systemView={systemView} onSystemChange={setSystemView} />
        <main className="ml-56 min-h-screen p-8">
          {systemView === "itinerary-editor" ? (
            <ItineraryEditorView tours={tours} onBack={() => { setSystemView("admin"); setActiveView("tour-catalog"); }} />
          ) : activeView === "tour-catalog" ? (
            <TourCatalogView tours={tours} onToggleStatus={handleToggleStatus} onEdit={openEdit} onAddTour={openAdd} onRefresh={handleRefresh} onDelete={handleDelete} onOpenBooking={openBooking} />
          ) : activeView === "pricing-cms" ? (
            <PricingCMSView />
          ) : (
            <PlaceholderView title={viewTitles[activeView]} />
          )}
        </main>
        {modalTour && (
          <TourTemplateModal tour={modalTour} isNew={isNewTour}
            onClose={() => { setModalTour(null); setIsNewTour(false); }}
            onSave={handleSave} onToggleStatus={handleToggleStatus} onDelete={handleDelete} onOpenBooking={openBooking} />
        )}
        {bookingPreviewTour && bookingItinerary && (
          <ItineraryPlanner itinerary={bookingItinerary} sequence={bookingPreviewTour.id.replace(/[^0-9]/g, "").padStart(4, "0").slice(-4) || "0001"} onClose={() => setBookingPreviewTour(null)} />
        )}
      </div>
      </RegionsCtx.Provider>
      </AirportPricingCtx.Provider>
    </DebugCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AdminShell />);
</script>


</body></html>
