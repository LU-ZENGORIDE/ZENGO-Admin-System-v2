function estimateRouteMetrics(waypoints) {
  const pickup = waypoints.pickupMapLocation;

  if (!pickup || !dropoff) return null;
  const points = [pickup, ...waypoints.stopovers.map((s) => s.mapLocation).filter(Boolean), dropoff];
  const hash = (str) => { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 10007; return h; };

  for (let i = 0; i < points.length - 1; i++) {
    const seed = hash(`${points[i].title}::${points[i + 1].title}`);
    distanceKm += 8 + (seed % 40);

  distanceKm = Math.round(distanceKm * 10) / 10;

/* ---------------- Route Map (ported from components/booking/RouteMap.tsx) ---------------- */
function hashRouteName(str) { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 9973; return h; }
function RouteMap({ waypoints }) {
  const points = [
    { name: waypoints.pickup || "Pick-up", kind: "start" },
    ...waypoints.stopovers.map((s) => ({ name: s.location || "Stop", kind: "stop" })),
    { name: waypoints.dropoff || "Drop-off", kind: "end" },
  ];
  const n = points.length;
  const coords = points.map((p, i) => ({ x: n === 1 ? 50 : 14 + (72 * i) / (n - 1), y: 34 + (hashRouteName(p.name + i) % 34) }));
  const polyline = coords.map((c) => `${c.x},${c.y}`).join(" ");
  return (
    <div className="mt-3 overflow-hidden rounded-xl border border-gray-200 bg-white">
      <div className="flex items-center justify-between gap-3 border-b border-gray-100 bg-gray-50/80 px-3.5 py-2.5">
        <p className="text-[11px] font-bold uppercase tracking-wide text-gray-400">Route overview</p>
        <p className="text-xs text-gray-400">{n} points · schematic order, not to scale</p>
      </div>
      <div className="relative h-[260px]" style={{ backgroundColor: "#f7f8fa", backgroundImage: "linear-gradient(#e9ebef 1px, transparent 1px), linear-gradient(90deg, #e9ebef 1px, transparent 1px)", backgroundSize: "32px 32px" }}>
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="absolute inset-0 h-full w-full">
          <polyline points={polyline} fill="none" stroke="#121621" strokeWidth={0.4} strokeDasharray="1.6 1.2" vectorEffect="non-scaling-stroke" />
        </svg>
        {points.map((p, i) => {
          const c = coords[i];
          const color = p.kind === "start" ? "#16a34a" : p.kind === "end" ? "#dc2626" : "#121621";
          const marker = p.kind === "start" ? "A" : p.kind === "end" ? "B" : String(i);
          return (
            <div key={`${p.name}-${i}`} className="absolute flex max-w-[132px] -translate-x-1/2 -translate-y-1/2 flex-col items-center gap-1.5" style={{ left: `${c.x}%`, top: `${c.y}%` }}>
              <span className="flex h-6 w-6 items-center justify-center rounded-full text-[11px] font-bold text-white shadow" style={{ background: color }}>{marker}</span>
              <span className="max-w-[132px] truncate rounded-md border border-gray-200 bg-white/95 px-1.5 py-0.5 text-[11px] font-semibold text-gray-900">{p.name}</span>
            </div>
          );
        })}
      </div>
      <div className="flex flex-wrap items-center gap-4 border-t border-gray-100 bg-gray-50/80 px-3.5 py-2.5 text-[11px] text-gray-400">
        <span className="inline-flex items-center gap-1.5"><span className="h-2 w-2 rounded-full bg-emerald-600" />Start</span>
        <span className="inline-flex items-center gap-1.5"><span className="h-2 w-2 rounded-full bg-[#121621]" />Stopover</span>
        <span className="inline-flex items-center gap-1.5"><span className="h-2 w-2 rounded-full bg-red-600" />End</span>
      </div>
    </div>
  );
}

/* ---------------- Vehicle Pricing Tables (ported from components/booking/*VehiclePricingTable.tsx) ---------------- */
function pricingRowKey(row) { return `${row.vehicleType}::${row.vehicleName}`; }
function loadSightseeingRowsForOffice(office) {
  return SIGHTSEEING_PRICE_SEED.filter((row) => row.office === office && row.available).map((row) => ({
    vehicleType: row.vehicleType, vehicleName: row.vehicleName, owner: row.owner, halfDayPrice: row.halfDayPrice, fullDayPrice: row.fullDayPrice, custom: false, customPrice: "",
  }));
}
function VehiclePricingTable({ officeLocation, durationTier, pricing, onChange, locked = false }) {
  const isHalfDay = durationTier.startsWith("Half Day");
  const applicableLabel = isHalfDay ? "Half Day" : "Full Day";
  const stale = pricing !== null && pricing.office !== officeLocation;
  const activeOffice = pricing?.office ?? officeLocation;
  const activeRows = pricing?.rows ?? loadSightseeingRowsForOffice(officeLocation);
  const handleReload = () => {
    const freshRows = loadSightseeingRowsForOffice(officeLocation);
    const prevByKey = new Map(activeRows.map((r) => [pricingRowKey(r), r]));
    const rows = freshRows.map((row) => { const prev = prevByKey.get(pricingRowKey(row)); return prev ? { ...row, custom: prev.custom, customPrice: prev.customPrice } : row; });
    onChange({ office: officeLocation, rows });
  };
  const toggleCustom = (index) => {
    const rows = [...activeRows]; const row = rows[index]; const willBeOn = !row.custom;
    rows[index] = { ...row, custom: willBeOn, customPrice: willBeOn ? String(isHalfDay ? row.halfDayPrice : row.fullDayPrice) : "" };
    onChange({ office: activeOffice, rows });
  };
  const setCustomPrice = (index, value) => { const rows = [...activeRows]; rows[index] = { ...rows[index], customPrice: value }; onChange({ office: activeOffice, rows }); };
  const overrideCount = activeRows.filter((r) => r.custom).length;
  const missingCount = activeRows.filter((r) => r.custom && !r.customPrice.trim()).length;
  return (
    <div className="relative rounded-xl border border-gray-200 p-4">
      <button type="button" title="Reload from CMS" disabled={locked} onClick={handleReload}
        className="absolute right-3 top-3 inline-flex h-7 w-7 items-center justify-center rounded-full border border-gray-200 bg-white text-gray-400 transition hover:border-gray-900 hover:text-gray-900 disabled:cursor-default disabled:opacity-40">
        <IconRefresh size={14} />
      </button>
      <div className="flex items-start justify-between gap-4 pr-9">
        <div>
          <p className="flex items-center gap-2 text-sm font-bold text-gray-800"><IconDollar size={16} className="text-gray-500" />Vehicle Pricing</p>
          <p className="mt-1 text-xs text-gray-500">Sightseeing category · {officeLocation} office · available vehicles only</p>
        </div>
        {pricing && !locked && <button type="button" onClick={() => onChange(null)} className="h-8 shrink-0 rounded-lg border border-gray-200 bg-white px-3 text-[13px] font-medium text-gray-600 transition hover:bg-gray-50">Clear</button>}
      </div>
      {stale && <div className="mt-3.5 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-xs text-amber-800">Loaded for the {pricing.office} office — this template is now set to {officeLocation}. Reload to refresh the list.</div>}
      {activeRows.length === 0 ? (
        <div className="mt-3.5 rounded-[10px] border border-dashed border-gray-200 bg-gray-50/60 p-5 text-center text-xs text-gray-500">No available Sightseeing vehicles found for {officeLocation}.</div>
      ) : (
        <div className="mt-3.5 overflow-x-auto rounded-[10px] border border-gray-200">
          <table className="w-full min-w-[560px] border-collapse text-left text-[13px]">
            <thead><tr className="border-b border-gray-200 bg-gray-50">
              {["Vehicle Type","Vehicle Name","Owner","Half Day ¥","Full Day ¥","Custom","Custom Price ¥"].map((c) => <th key={c} className="whitespace-nowrap px-2 py-2 text-left text-[10px] font-bold uppercase tracking-wider text-gray-500">{c}</th>)}
            </tr></thead>
            <tbody>
              {activeRows.map((row, i) => {
                const invalid = row.custom && !row.customPrice.trim();
                return (
                  <tr key={pricingRowKey(row)} className="border-b border-gray-100 last:border-b-0">
                    <td className="whitespace-nowrap px-2 py-[9px] text-gray-700">{row.vehicleType}</td>
                    <td className="whitespace-nowrap px-2 py-[9px] font-medium text-gray-900">{row.vehicleName}</td>
                    <td className="px-2 py-[9px] text-gray-600">{row.owner}</td>
                    <td className="px-2 py-[9px] text-right tabular-nums text-gray-600">{row.halfDayPrice}</td>
                    <td className="px-2 py-[9px] text-right tabular-nums text-gray-600">{row.fullDayPrice}</td>
                    <td className="px-2 py-[9px]">
                      <button type="button" role="switch" aria-checked={row.custom} disabled={locked} onClick={() => toggleCustom(i)}
                        className={`inline-flex h-[22px] items-center rounded-full text-[10px] font-extrabold tracking-wide disabled:cursor-default disabled:opacity-60 ${row.custom ? "justify-start bg-[#FACC15] pl-[9px] pr-1 text-[#121621]" : "justify-end bg-gray-300 pl-1 pr-[9px] text-gray-600"}`}>
                        {row.custom ? <>ON<span className="ml-1 h-4 w-4 rounded-full bg-white" /></> : <><span className="mr-1 h-4 w-4 rounded-full bg-white" />OFF</>}
                      </button>
                    </td>
                    <td className="px-2 py-[9px]">
                      {!row.custom ? <span className="text-gray-300">—</span> : (
                        <input type="number" min="0" step="1000" readOnly={locked} value={row.customPrice} onChange={(e) => setCustomPrice(i, e.target.value)} placeholder={invalid ? "Required" : undefined}
                          className={`w-full rounded-lg border px-2 py-1.5 text-[13px] font-semibold tabular-nums outline-none ${invalid ? "border-red-300 bg-red-50 text-red-700 placeholder:text-red-400" : "border-gray-200 bg-white text-gray-900 focus:border-gray-400"}`} />
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          <div className="flex flex-wrap items-center justify-between gap-3 border-t border-gray-200 bg-gray-50 px-3 py-[9px]">
            <p className="text-xs text-gray-500">{activeRows.length} available vehicles from Pricing CMS · {overrideCount} custom override{overrideCount === 1 ? "" : "s"}{missingCount > 0 && ` · ${missingCount} missing a price`}</p>
            <p className="whitespace-nowrap text-xs font-semibold text-gray-900">{applicableLabel} ¥ applies to this template ({durationTier})</p>
          </div>
        </div>
      )}
    </div>
  );
}
function loadAirportRowsForOfficeAirport(office, airport) {
  return AIRPORT_PRICE_SEED.filter((row) => row.office === office && row.available).flatMap((row) => {
    const leg = row.legs.find((l) => l.airport === airport);
    if (!leg) return [];
    return [{ vehicleType: row.vehicleType, vehicleName: row.vehicleName, owner: row.owner, fixedFee: leg.fixedFee, distanceCapKm: leg.distanceCapKm ?? 0, excessRatePerKm: leg.excessRatePerKm ?? 0, custom: false, customPrice: "" }];
  });
}
function AirportVehiclePricingTable({ officeLocation, airport, pricing, onChange, locked = false }) {
  const stale = pricing !== null && (pricing.office !== officeLocation || pricing.airport !== airport);
  const activeOffice = pricing?.office ?? officeLocation;
  const activeAirport = pricing?.airport ?? airport;
  const activeRows = pricing?.rows ?? loadAirportRowsForOfficeAirport(officeLocation, airport);
  const handleReload = () => {
    const freshRows = loadAirportRowsForOfficeAirport(officeLocation, airport);
    const prevByKey = new Map(activeRows.map((r) => [pricingRowKey(r), r]));
    const rows = freshRows.map((row) => { const prev = prevByKey.get(pricingRowKey(row)); return prev ? { ...row, custom: prev.custom, customPrice: prev.customPrice } : row; });
    onChange({ office: officeLocation, airport, rows });
  };
  const toggleCustom = (index) => {
    const rows = [...activeRows]; const row = rows[index]; const willBeOn = !row.custom;
    rows[index] = { ...row, custom: willBeOn, customPrice: willBeOn ? String(row.fixedFee) : "" };
    onChange({ office: activeOffice, airport: activeAirport, rows });
  };
  const setCustomPrice = (index, value) => { const rows = [...activeRows]; rows[index] = { ...rows[index], customPrice: value }; onChange({ office: activeOffice, airport: activeAirport, rows }); };
  const overrideCount = activeRows.filter((r) => r.custom).length;
  const missingCount = activeRows.filter((r) => r.custom && !r.customPrice.trim()).length;
  return (
    <div className="relative rounded-xl border border-gray-200 p-4">
      <button type="button" title="Reload from CMS" disabled={locked} onClick={handleReload}
        className="absolute right-3 top-3 inline-flex h-7 w-7 items-center justify-center rounded-full border border-gray-200 bg-white text-gray-400 transition hover:border-gray-900 hover:text-gray-900 disabled:cursor-default disabled:opacity-40">
        <IconRefresh size={14} />
      </button>
      <div className="flex items-start justify-between gap-4 pr-9">
        <div>
          <p className="flex items-center gap-2 text-sm font-bold text-gray-800"><IconDollar size={16} className="text-gray-500" />Vehicle Pricing</p>
          <p className="mt-1 text-xs text-gray-500">Airport category · {officeLocation} office · {airportDisplayName(airport)} · available vehicles only</p>
        </div>
        {pricing && !locked && <button type="button" onClick={() => onChange(null)} className="h-8 shrink-0 rounded-lg border border-gray-200 bg-white px-3 text-[13px] font-medium text-gray-600 transition hover:bg-gray-50">Clear</button>}
      </div>
      {stale && <div className="mt-3.5 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-xs text-amber-800">Loaded for {pricing.office} office · {airportDisplayName(pricing.airport)} — this template is now set to {officeLocation} · {airportDisplayName(airport)}. Reload to refresh the list.</div>}
      {activeRows.length === 0 ? (
        <div className="mt-3.5 rounded-[10px] border border-dashed border-gray-200 bg-gray-50/60 p-5 text-center text-xs text-gray-500">No available Airport vehicles found for {officeLocation} · {airportDisplayName(airport)}.</div>
      ) : (
        <div className="mt-3.5 overflow-x-auto rounded-[10px] border border-gray-200">
          <table className="w-full min-w-[640px] border-collapse text-left text-[13px]">
            <thead><tr className="border-b border-gray-200 bg-gray-50">
              {["Vehicle Type","Vehicle Name","Owner","Fixed Fee ¥","Custom","Custom Price ¥"].map((c) => <th key={c} className="whitespace-nowrap px-2 py-2 text-left text-[10px] font-bold uppercase tracking-wider text-gray-500">{c}</th>)}
            </tr></thead>
            <tbody>
              {activeRows.map((row, i) => {
                const invalid = row.custom && !row.customPrice.trim();
                return (
                  <tr key={pricingRowKey(row)} className="border-b border-gray-100 last:border-b-0">
                    <td className="whitespace-nowrap px-2 py-[9px] text-gray-700">{row.vehicleType}</td>
                    <td className="whitespace-nowrap px-2 py-[9px] font-medium text-gray-900">{row.vehicleName}</td>
                    <td className="px-2 py-[9px] text-gray-600">{row.owner}</td>
                    <td className="px-2 py-[9px] text-right tabular-nums text-gray-600">{row.fixedFee}</td>
                    <td className="px-2 py-[9px]">
                      <button type="button" role="switch" aria-checked={row.custom} disabled={locked} onClick={() => toggleCustom(i)}
                        className={`inline-flex h-[22px] items-center rounded-full text-[10px] font-extrabold tracking-wide disabled:cursor-default disabled:opacity-60 ${row.custom ? "justify-start bg-[#FACC15] pl-[9px] pr-1 text-[#121621]" : "justify-end bg-gray-300 pl-1 pr-[9px] text-gray-600"}`}>
                        {row.custom ? <>ON<span className="ml-1 h-4 w-4 rounded-full bg-white" /></> : <><span className="mr-1 h-4 w-4 rounded-full bg-white" />OFF</>}
                      </button>
                    </td>
                    <td className="px-2 py-[9px]">
                      {!row.custom ? <span className="text-gray-300">—</span> : (
                        <input type="number" min="0" step="1000" readOnly={locked} value={row.customPrice} onChange={(e) => setCustomPrice(i, e.target.value)} placeholder={invalid ? "Required" : undefined}
                          className={`w-full rounded-lg border px-2 py-1.5 text-[13px] font-semibold tabular-nums outline-none ${invalid ? "border-red-300 bg-red-50 text-red-700 placeholder:text-red-400" : "border-gray-200 bg-white text-gray-900 focus:border-gray-400"}`} />
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          <div className="flex flex-wrap items-center justify-between gap-3 border-t border-gray-200 bg-gray-50 px-3 py-[9px]">
            <p className="text-xs text-gray-500">{activeRows.length} available vehicles from Pricing CMS · {overrideCount} custom override{overrideCount === 1 ? "" : "s"}{missingCount > 0 && ` · ${missingCount} missing a price`}</p>
            <p className="whitespace-nowrap text-xs font-semibold text-gray-900">Fixed fee ¥ applies to this template ({airportDisplayName(airport)})</p>
          </div>
        </div>
      )}
    </div>
  );
}

                      </label>

                  </div>
                )}
              </th>
            </tr>
          </thead>
          <tbody>
            {sorted.length === 0 ? (
              <tr><td colSpan={orderedCols.length + 3} className="px-4 py-14 text-center" style={{ color: "var(--text-3)" }}>No tours match your filters.</td></tr>
            ) : sorted.map((tour) => (
              <tr key={tour.id} onClick={() => onEdit(tour.id)} className="group cursor-pointer border-b transition hover:bg-black/[0.03]" style={{ borderColor: "var(--border-soft)" }}>
                {orderedCols.map((key) => (
                  <td key={key} className="px-4 py-3.5 align-top" onClick={key === "status" ? (e) => e.stopPropagation() : undefined}>
                    <DebugField model="tour_templates" field={COLUMN_DB_FIELDS[key]}>{renderCell(tour, key)}</DebugField>
                  </td>
                ))}
                <td className="px-4 py-3.5 text-right">
                  <div className="flex items-center justify-end gap-1">
                    <button type="button" title="Open tour details page" onClick={(e) => { e.stopPropagation(); window.open(tour.previewLinks.tourDetails, "_blank", "noopener,noreferrer"); }} className="rounded p-1.5 text-blue-500 transition hover:bg-blue-50 dark:hover:bg-blue-500/10"><IconGlobe size={16} /></button>
                    <button type="button" title="Preview booking page" onClick={(e) => { e.stopPropagation(); onOpenBooking(tour); }} className="rounded p-1.5 text-violet-500 transition hover:bg-violet-50 dark:hover:bg-violet-500/10"><IconCalendarClock size={16} /></button>
                  </div>
                </td>
                <td className="w-8 px-2 py-3.5">
                  <button type="button" title="Delete template" onClick={(e) => { e.stopPropagation(); setDeleteTarget(tour); }} className="rounded p-1.5 text-gray-400 transition hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-500/10"><IconTrash size={16} /></button>
                </td>
                <td className="w-8" />
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {deleteTarget && (
        <ConfirmDialog title="Delete this template?"
          description={`"${deleteTarget.tripName || "Untitled template"}" (${deleteTarget.id}) will be permanently removed from the catalog. This can't be undone.`}
          confirmLabel="Delete template" onCancel={() => setDeleteTarget(null)}
          onConfirm={() => { onDelete(deleteTarget.id); setDeleteTarget(null); }} />
      )}
    </div>
  );
}

/* ---------------- Tour Template Modal (ported from components/TourTemplateModal.tsx) ---------------- */
const EDIT_ROUTE_ROW_GRID = "grid grid-cols-1 gap-2 sm:grid-cols-[1fr_7rem_2.75rem_2rem] sm:items-end";
function TTFieldLabel({ children }) {
  return <label className="mb-1 block text-xs font-semibold uppercase tracking-wide" style={{ color: "var(--text-3)" }}>{children}</label>;
}
function TourTemplateModal({ tour, isNew, onClose, onSave, onToggleStatus, onDelete, onOpenBooking }) {
  const [draft, setDraft] = useState(null);
  const [baseline, setBaseline] = useState(null);
  const [mode, setMode] = useState("view");
  const [history, setHistory] = useState([]);
  const [routeEditing, setRouteEditing] = useState(false);
  const [routeCopy, setRouteCopy] = useState(null);
  const [deleteConfirmOpen, setDeleteConfirmOpen] = useState(false);
  const [routeMapOpen, setRouteMapOpen] = useState(false);
  const [showHidden, setShowHidden] = useState(false);
  const [saveError, setSaveError] = useState(null);
  const fieldSnapshotRef = useRef(null);

  useEffect(() => {
    if (tour) {
      const clone = (v) => JSON.parse(JSON.stringify(v));
      setDraft(clone(tour));
      setBaseline(isNew ? null : clone(tour));
      setMode(isNew ? "edit" : "view");
      setHistory([]);
      setRouteEditing(isNew);
      setRouteCopy(isNew ? clone(tour.waypoints) : null);
      setRouteMapOpen(false);
      setShowHidden(false);
      setSaveError(null);
    }
    // eslint-disable-next-line
  }, [tour && tour.id, isNew]);

  if (!tour || !draft) return null;
  const clone = (v) => JSON.parse(JSON.stringify(v));
  const locked = mode === "view";

  const hasCustomOverride = !!draft.vehiclePricing?.rows.some((r) => r.custom) || !!draft.airportVehiclePricing?.rows.some((r) => r.custom);
  const hasEdits = history.length > 0 || hasCustomOverride;

  const update = (patch) => setDraft((prev) => (prev ? { ...prev, ...patch } : prev));
  const updateRouteCopy = (patch) => setRouteCopy((prev) => (prev ? { ...prev, ...patch } : prev));
  const commit = (label, patch) => {
    setHistory((h) => [...h, { label, snapshot: clone(draft) }]);
    setDraft({ ...draft, ...patch });
    setSaveError(null);
  };
  const withSuggestedPrice = (patch) => {
    if (draft.price !== null) return patch;
    const nextOffice = patch.officeLocation ?? draft.officeLocation;
    const nextDuration = patch.durationTier ?? draft.durationTier;
    if (!nextOffice || !nextDuration) return patch;
    return { ...patch, price: suggestedPriceForOffice(nextOffice, nextDuration.startsWith("Half Day")) };
  };
  const applyPickupResolution = (patch, resolved) => {
    if (routeEditing) {
      setRouteCopy((prev) => (prev ? { ...prev, pickup: resolved.pickup, pickupMapLocation: resolved.pickupMapLocation } : prev));
      return patch;
    }
    return { ...patch, waypoints: { ...draft.waypoints, pickup: resolved.pickup, pickupMapLocation: resolved.pickupMapLocation } };
  };
  const selectServiceType = (type) => {
    const newId = draftIdForServiceType(type);
    let patch = { serviceType: type, id: newId, reference: newId, price: null, vehiclePricing: null, airportVehiclePricing: null };
    if (type === "Sightseeing Charter") {
      patch = { ...patch, airport: null };
    } else {
      const resolved = resolveAirportPickup(draft.officeLocation);
      patch = { ...patch, durationTier: null, airport: resolved.airport };
      patch = applyPickupResolution(patch, resolved);
    }
    commit("Service type selected", patch);
  };
  const selectOffice = (loc) => {
    let patch = withSuggestedPrice({ officeLocation: loc });
    if (draft.serviceType === "Airport") {
      const resolved = resolveAirportPickup(loc);
      patch = { ...patch, airport: resolved.airport };
      patch = applyPickupResolution(patch, resolved);
    }
    commit("Office changed", patch);
  };
  const selectAirport = (airport) => {
    const patch = applyPickupResolution({ airport }, { pickup: airportDisplayName(airport), pickupMapLocation: AIRPORT_MAP_LOCATIONS[airport] ?? null });
    commit("Airport selected", patch);
  };
  const toggleStatusNow = () => {
    const next = draft.status === "active" ? "inactive" : "active";
    setDraft((prev) => (prev ? { ...prev, status: next } : prev));
    if (!isNew) {
      setBaseline((prev) => (prev ? { ...prev, status: next } : prev));
      onToggleStatus(tour.id);
    }
  };
  const undo = () => {
    if (history.length === 0) return;
    const last = history[history.length - 1];
    setHistory(history.slice(0, -1));
    setDraft(last.snapshot);
    setRouteEditing(false);
    setRouteCopy(null);
    setSaveError(null);
  };
  const enterEdit = () => setMode("edit");
  const cancelEdits = () => {
    if (mode === "view" || !baseline) { onClose(); return; }
    setDraft(clone(baseline));
    setMode("view");
    setHistory([]);
    setRouteEditing(false);
    setRouteCopy(null);
    setSaveError(null);
  };
  const editRoute = () => { setMode("edit"); setRouteEditing(true); setRouteCopy(clone(draft.waypoints)); };
  const discardRoute = () => { setRouteEditing(false); setRouteCopy(null); };
  const applyRoute = () => {
    if (!routeCopy) return;
    const unchanged = JSON.stringify(draft.waypoints) === JSON.stringify(routeCopy);
    if (unchanged) { setRouteEditing(false); setRouteCopy(null); setSaveError(null); return; }
    const metrics = estimateRouteMetrics(routeCopy);
    setHistory((h) => [...h, { label: "Route updated", snapshot: clone(draft) }]);
    setDraft({ ...draft, waypoints: clone(routeCopy), startTime: routeCopy.pickupTime, routeDistanceKm: metrics?.distanceKm ?? null, routeDurationMins: metrics?.durationMins ?? null });
    setRouteEditing(false);
    setRouteCopy(null);
    setSaveError(null);
  };
  const onFieldFocus = () => { fieldSnapshotRef.current = clone(draft); };
  const onFieldBlur = () => {
    const before = fieldSnapshotRef.current;
    fieldSnapshotRef.current = null;
    if (!before) return;
    if (JSON.stringify(before) === JSON.stringify(draft)) return;
    setHistory((h) => [...h, { label: "Field edited", snapshot: before }]);
  };
  const handleVehiclePricingChange = (pricing) => {
    if (pricing === null && draft.vehiclePricing) commit("Vehicle prices cleared", { vehiclePricing: null });
    else update({ vehiclePricing: pricing });
  };
  const handleAirportVehiclePricingChange = (pricing) => {
    if (pricing === null && draft.airportVehiclePricing) commit("Vehicle prices cleared", { airportVehiclePricing: null });
    else update({ airportVehiclePricing: pricing });
  };
  const handleSave = () => {
    if (!draft.tripName.trim()) return setSaveError("Give the template a trip name before saving.");
    if (!draft.serviceType) return setSaveError("Select a service type before saving.");
    if (!draft.officeLocation) return setSaveError("Select an office location before saving.");
    if (draft.serviceType === "Sightseeing Charter" && !draft.durationTier) return setSaveError("Select a duration tier before saving.");
    if (draft.serviceType === "Airport" && !draft.airport) return setSaveError("Select an airport before saving.");
    const hasMissingCustomPrice = draft.vehiclePricing?.rows.some((row) => row.custom && !row.customPrice.trim()) || draft.airportVehiclePricing?.rows.some((row) => row.custom && !row.customPrice.trim());
    if (hasMissingCustomPrice) return setSaveError("Set a custom price for every vehicle with Custom turned on, or turn Custom off.");
    setSaveError(null);
    onSave({ ...draft, reference: draft.id, startTime: draft.waypoints.pickupTime });
  };

  const wp = routeEditing && routeCopy ? routeCopy : draft.waypoints;
  const readyForPrice = draft.serviceType === "Sightseeing Charter" ? !!draft.officeLocation && !!draft.durationTier : draft.serviceType === "Airport" ? !!draft.officeLocation : false;
  const canSave = !!draft.tripName.trim() && !!draft.serviceType && !!draft.officeLocation && (draft.serviceType === "Airport" ? !!draft.airport : !!draft.durationTier);
  const dirty = baseline ? JSON.stringify(baseline) !== JSON.stringify(draft) : true;
  const saveEnabled = canSave && dirty && hasEdits && !routeEditing;
  const lastLabel = history.length ? history[history.length - 1].label : hasCustomOverride ? "Custom price set" : "";
  const footerNote = saveError ? saveError : mode === "view" ? "Viewing — locked. Choose Edit template to make changes." : routeEditing ? "Editing route — choose Set route to apply it to this template." : hasEdits ? `${history.length || 1} unsaved change${(history.length || 1) === 1 ? "" : "s"} · last: ${lastLabel}` : "No changes yet.";
  const footerNoteClass = saveError ? "font-medium text-red-600" : hasEdits && mode === "edit" ? "font-medium" : "";

  const fieldClass = `w-full rounded-lg border px-3 py-2.5 text-sm outline-none ${locked ? "cursor-default" : "focus:border-gray-400"}`;
  const numFieldClass = `w-full rounded-lg border px-3 py-2 text-sm outline-none ${locked ? "cursor-default" : "focus:border-gray-400"}`;
  const smallFieldClass = numFieldClass;
  const fieldStyle = locked ? { borderColor: "var(--border)", background: "var(--bg-subtle)", color: "var(--text-2)" } : { borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-1)" };
  const linkFieldClass = "w-full rounded-lg border px-3 py-2 text-xs font-medium outline-none";
  const linkFieldStyle = locked ? { borderColor: "rgba(139,92,246,.25)", background: "rgba(139,92,246,.05)", color: "rgba(139,92,246,.6)" } : { borderColor: "rgba(139,92,246,.4)", background: "rgba(139,92,246,.08)", color: "#7c3aed" };

  const routeRows = [
    { badge: "Pick-up", tone: "green", name: draft.waypoints.pickup, meta: draft.serviceType === "Airport" ? "" : draft.waypoints.pickupTime, pin: draft.waypoints.pickupMapLocation },
    ...draft.waypoints.stopovers.map((s, i) => ({ badge: `Stop ${i + 1}`, tone: "plain", name: s.location, meta: s.waitTime, pin: s.mapLocation })),
    { badge: "Drop-off", tone: "red", name: draft.waypoints.dropoff, meta: "", pin: draft.waypoints.dropoffMapLocation },
  ];

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center overflow-y-auto bg-black/50 p-2 sm:p-8">
      <div role="dialog" aria-modal="true" className="flex max-h-[calc(100vh-1rem)] w-full max-w-5xl flex-col overflow-hidden rounded-2xl shadow-2xl sm:max-h-[calc(100vh-2rem)]" style={{ background: "var(--bg-card)" }}>
        {/* Header */}
        <div className="flex items-start justify-between gap-4 border-b px-4 py-4 sm:px-6 sm:py-5" style={{ borderColor: "var(--border)" }}>
          <div className="flex min-w-0 flex-1 items-start gap-3">
            <span className="mono shrink-0 rounded-lg px-3 py-1 text-sm font-bold" style={{ background: "var(--bg-subtle)", color: "var(--text-1)" }}>{draft.id}</span>
            <div className="min-w-0 flex-1">
              <div className="flex flex-wrap items-center gap-3">
                <h2 className="truncate text-[17px] font-bold tracking-tight" style={{ color: "var(--text-1)" }}>{isNew ? "Create trip template" : draft.tripName || "Untitled template"}</h2>
                <button type="button" role="switch" aria-checked={draft.status === "active"} title="Toggle active status" onClick={toggleStatusNow}
                  className={`inline-flex items-center gap-2 rounded-full px-3 py-1 text-xs font-semibold transition hover:opacity-80 ${draft.status === "active" ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-500/15 dark:text-emerald-300" : "bg-gray-100 text-gray-600 dark:bg-white/10 dark:text-gray-300"}`}>
                  <span className={`h-2 w-2 rounded-full ${draft.status === "active" ? "bg-emerald-500" : "bg-gray-400"}`} />
                  {draft.status === "active" ? "Active" : "Inactive"}
                </button>
              </div>
              <p className="mt-0.5 truncate text-xs" style={{ color: "var(--text-3)" }}>
                {draft.serviceType === "Sightseeing Charter" && draft.officeLocation
                  ? `${draft.officeLocation} office · Sightseeing Charter${draft.durationTier ? ` · ${draft.durationTier} · start ${draft.waypoints.pickupTime}` : ""}`
                  : draft.serviceType === "Airport" && draft.officeLocation
                    ? `${draft.officeLocation} office · Airport transfer${draft.airport ? ` · ${airportDisplayName(draft.airport)}` : ""}`
                    : "Service type and office not set yet"}
              </p>
            </div>
          </div>
          <div className="flex shrink-0 items-center gap-2 sm:gap-3">
            <button type="button" onClick={() => setShowHidden((v) => !v)} className="inline-flex items-center gap-1.5 rounded-lg border px-2.5 py-1.5 text-xs font-medium transition hover:bg-black/5" style={{ borderColor: "var(--border)", color: "var(--text-2)" }}>

            </button>
            <button type="button" onClick={onClose} className="rounded-lg p-1.5 transition hover:bg-black/5" style={{ color: "var(--text-3)" }}><IconX size={18} /></button>

        </div>

        {/* Body */}
        <div className="grid min-h-0 flex-1 grid-cols-1 overflow-y-auto md:grid-cols-[340px_minmax(0,1fr)] md:overflow-hidden">

            <p className="text-[11px] font-bold uppercase tracking-wide" style={{ color: "var(--text-3)" }}>Template</p>

            <DebugField model="tour_templates" field="service_type">
              <div>
                <TTFieldLabel>Service Type</TTFieldLabel>
                <div className="flex flex-wrap gap-1.5">
                  {SERVICE_TYPES.map((type) => {
                    const selected = draft.serviceType === type;
                    return (
                      <button key={type} type="button" disabled={locked} onClick={() => selectServiceType(type)}
                        className={`rounded-lg border px-2.5 py-2 text-xs font-bold transition disabled:cursor-default ${selected ? serviceTypeBadgeClasses(type) + " border-transparent" : `${locked ? "opacity-60" : "hover:bg-black/5"}`}`}
                        style={selected ? {} : { borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-2)" }}>
                        {type}
                      </button>

                </div>
              </div>
            </DebugField>

            <DebugField model="tour_templates" field="trip_name">
              <div>
                <TTFieldLabel>Trip Name</TTFieldLabel>
                <input type="text" readOnly={locked} value={draft.tripName} onChange={(e) => update({ tripName: e.target.value })} onFocus={onFieldFocus} onBlur={onFieldBlur}

                      style={draft.officeLocation === loc ? {} : { borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-2)" }}>
                      {loc}
                    </button>
                  ))}
                </div>
              </div>
            </DebugField>

            {draft.serviceType === "Airport" ? (
              draft.officeLocation && (OFFICE_AIRPORTS[draft.officeLocation]?.length ?? 0) > 1 && (
                <DebugField model="tour_templates" field="airport_code">
                  <div>
                    <TTFieldLabel>Airport</TTFieldLabel>
                    <div className="grid grid-cols-2 gap-1.5">
                      {OFFICE_AIRPORTS[draft.officeLocation].map((airport) => (
                        <button key={airport} type="button" disabled={locked} onClick={() => selectAirport(airport)}
                          className={`rounded-lg border px-2.5 py-2 text-center text-xs font-semibold transition disabled:cursor-default ${draft.airport === airport ? "border-transparent bg-[#121621] text-white" : locked ? "opacity-60" : "hover:bg-black/5"}`}
                          style={draft.airport === airport ? {} : { borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-2)" }}>
                          {airportDisplayName(airport)}
                        </button>
                      ))}
                    </div>
                  </div>
                </DebugField>
              )
            ) : (
              <DebugField model="tour_templates" field="duration_tier">
                <div>
                  <TTFieldLabel>Duration Tier</TTFieldLabel>
                  <div className="grid grid-cols-2 gap-1.5">
                    {DURATION_TIERS.map((tier) => (
                      <button key={tier} type="button" disabled={locked} onClick={() => commit("Duration tier changed", withSuggestedPrice({ durationTier: tier }))}
                        className={`rounded-lg border px-2.5 py-2 text-center text-xs font-semibold transition disabled:cursor-default ${draft.durationTier === tier ? "border-transparent bg-[#121621] text-white" : locked ? "opacity-60" : "hover:bg-black/5"}`}
                        style={draft.durationTier === tier ? {} : { borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-2)" }}>
                        {tier}
                      </button>

                  </div>

                  <p className="mt-0.5 text-sm font-bold tabular-nums text-[#FACC15]">{draft.price !== null ? formatPrice(draft.price) : "--"}</p>

                <div>

                  <input type="number" min="0" step="1000" readOnly={locked} value={draft.price ?? 0} onChange={(e) => update({ price: parseInt(e.target.value, 10) || 0 })} onFocus={onFieldFocus} onBlur={onFieldBlur} className={numFieldClass} style={fieldStyle} />

              <p className="-mt-1 text-[11px]" style={{ color: "var(--text-3)" }}>Distance and duration are calculated once the route's pick-up and drop-off pins are set — or preset them manually below.</p>

                </div>

            <p className="text-[11px] font-bold uppercase tracking-wide" style={{ color: "var(--text-3)" }}>Public Links</p>
            <div className="flex flex-col gap-2">

                  </div>

              </DebugField>
              <DebugField model="tour_templates" field="tour_booking_url">
                <div>
                  <TTFieldLabel>Booking page</TTFieldLabel>
                  <div className="flex items-center gap-1.5">
                    <input type="url" aria-label="Booking URL" readOnly={locked} value={draft.previewLinks.tourBooking}
                      onChange={(e) => update({ previewLinks: { ...draft.previewLinks, tourBooking: e.target.value } })} onFocus={onFieldFocus} onBlur={onFieldBlur}
                      placeholder="/tours/your-slug/00001/2026-09-02" className={linkFieldClass} style={linkFieldStyle} />
                    {!isNew && draft.previewLinks.tourBooking && (
                      <button type="button" title="Preview booking page" onClick={() => onOpenBooking(draft)}
                        className="shrink-0 rounded-lg border p-2 text-violet-500 transition hover:bg-violet-50 dark:hover:bg-violet-500/10" style={{ borderColor: "var(--border)", background: "var(--bg-card)" }}>
                        <IconCalendarClock size={16} />
                      </button>
                    )}
                  </div>
                </div>
              </DebugField>
            </div>

            {showHidden && (
              <div className="flex flex-col gap-3 rounded-lg border border-dashed p-3.5" style={{ borderColor: "var(--border)", background: "var(--bg-card)" }}>
                <p className="text-[11px] font-bold uppercase tracking-wide" style={{ color: "var(--text-3)" }}>Redacted fields</p>
                {[["User Name", "userName", "user_name"], ["Email", "userEmail", "user_email"], ["User Source", "userSource", "user_source"], ["Payment Status", "paymentStatus", "payment_status"]].map(([label, key, dbField]) => (
                  <DebugField key={key} model="tour_templates" field={dbField}>
                    <div>
                      <TTFieldLabel>{label}</TTFieldLabel>
                      <input type="text" readOnly={locked} value={draft[key] ?? ""} onChange={(e) => update({ [key]: e.target.value || null })} onFocus={onFieldFocus} onBlur={onFieldBlur} placeholder="—" className={smallFieldClass} style={fieldStyle} />
                    </div>
                  </DebugField>
                ))}
                <div className="grid grid-cols-2 gap-2">
                  <DebugField model="tour_templates" field="driver_name">
                    <div>
                      <TTFieldLabel>Driver</TTFieldLabel>
                      <input type="text" readOnly={locked} value={draft.driverName ?? ""} onChange={(e) => update({ driverName: e.target.value || null })} onFocus={onFieldFocus} onBlur={onFieldBlur} className={smallFieldClass} style={fieldStyle} />
                    </div>
                  </DebugField>
                  <DebugField model="tour_templates" field="plate_number">
                    <div>
                      <TTFieldLabel>Plate Number</TTFieldLabel>
                      <input type="text" readOnly={locked} value={draft.plateNumber ?? ""} onChange={(e) => update({ plateNumber: e.target.value || null })} onFocus={onFieldFocus} onBlur={onFieldBlur} className={smallFieldClass} style={fieldStyle} />
                    </div>
                  </DebugField>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <DebugField model="tour_templates" field="passengers">
                    <div>
                      <TTFieldLabel>Passengers</TTFieldLabel>
                      <select disabled={locked} value={draft.passengers ?? ""} onChange={(e) => update({ passengers: e.target.value ? Number(e.target.value) : null })} className={smallFieldClass} style={fieldStyle}>
                        <option value="">—</option>
                        {[1, 2, 3, 4, 5, 6, 7, 8].map((n) => <option key={n} value={n}>{n}</option>)}
                      </select>
                    </div>
                  </DebugField>
                  <DebugField model="tour_templates" field="luggage">
                    <div>
                      <TTFieldLabel>Luggage</TTFieldLabel>
                      <select disabled={locked} value={draft.luggage ?? ""} onChange={(e) => update({ luggage: e.target.value ? Number(e.target.value) : null })} className={smallFieldClass} style={fieldStyle}>
                        <option value="">—</option>
                        {[0, 1, 2, 3, 4].map((n) => <option key={n} value={n}>{n}</option>)}
                      </select>
                    </div>
                  </DebugField>
                </div>
              </div>
            )}
          </div>

          {/* Right: Route + Vehicle Pricing */}
          <div className="flex flex-col gap-6 p-4 sm:p-5 md:overflow-y-auto">
            <div>
              <div className="mb-3.5 flex flex-wrap items-center justify-between gap-3">
                <p className="flex items-center gap-2 text-[11px] font-bold uppercase tracking-wide" style={{ color: "var(--text-3)" }}><IconMapPin size={14} />Route</p>
                <div className="flex flex-wrap items-center gap-2.5">
                  <p className="text-xs" style={{ color: "var(--text-3)" }}>
                    {wp.stopovers.length} stopover{wp.stopovers.length === 1 ? "" : "s"} · {draft.routeDistanceKm !== null ? `${draft.routeDistanceKm.toFixed(1)} km` : "--"} · {formatDuration(draft.routeDurationMins)}
                  </p>
                  <button type="button" onClick={() => setRouteMapOpen((v) => !v)}
                    className="inline-flex h-[30px] items-center gap-1.5 rounded-lg border px-3 text-xs font-semibold transition hover:bg-black/5"
                    style={routeMapOpen ? { borderColor: "#121621", background: "var(--bg-subtle)", color: "var(--text-1)" } : { borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-2)" }}>
                    {routeMapOpen ? "Hide map" : "Show map"}
                  </button>
                  {!routeEditing ? (
                    <button type="button" onClick={editRoute} disabled={locked} className="inline-flex h-[30px] items-center gap-1.5 rounded-lg border px-3 text-xs font-semibold transition hover:bg-black/5 disabled:cursor-not-allowed disabled:opacity-50" style={{ borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-2)" }}>
                      <IconPencil size={14} />Edit route
                    </button>
                  ) : (
                    <>
                      <button type="button" onClick={discardRoute} className="inline-flex h-[30px] items-center rounded-lg border px-3 text-xs font-medium transition hover:bg-black/5" style={{ borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-2)" }}>Discard</button>
                      <button type="button" onClick={applyRoute} className="inline-flex h-[30px] items-center gap-1.5 rounded-lg border border-[#121621] bg-[#121621] px-3 text-xs font-semibold text-white transition hover:bg-gray-800"><IconCheck size={14} />Set route</button>
                    </>
                  )}
                </div>
              </div>

              <div className="overflow-hidden rounded-xl border" style={{ borderColor: "var(--border)" }}>
                {!routeEditing ? (
                  routeRows.map((row, i) => (
                    <div key={row.badge} className={`grid grid-cols-[64px_minmax(0,1fr)_auto_24px] items-center gap-2 px-3 py-3 sm:grid-cols-[80px_minmax(0,1fr)_auto_28px] sm:gap-2.5 sm:px-3.5 ${i !== routeRows.length - 1 ? "border-b" : ""}`}
                      style={{ borderColor: "var(--border-soft)", background: row.tone !== "plain" ? "var(--bg-subtle)" : "transparent" }}>
                      {row.tone === "plain" ? (
                        <span className="text-xs font-semibold" style={{ color: "var(--text-3)" }}>{row.badge}</span>
                      ) : (
                        <span className={`inline-flex w-fit items-center justify-center rounded-md px-2 py-0.5 text-[11px] font-bold uppercase tracking-wide ${row.tone === "green" ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-500/15 dark:text-emerald-300" : "bg-red-100 text-red-800 dark:bg-red-500/15 dark:text-red-300"}`}>{row.badge}</span>
                      )}
                      <span className="truncate text-sm font-medium" style={{ color: "var(--text-1)" }}>{row.name || "—"}</span>
                      <span className="whitespace-nowrap text-xs tabular-nums" style={{ color: "var(--text-3)" }}>{row.meta}</span>
                      <IconMapPin size={16} className="justify-self-end" style={{ color: row.pin ? "#059669" : "var(--border)" }} />
                    </div>
                  ))
                ) : (
                  <>
                    <div className={`border-b p-3 ${EDIT_ROUTE_ROW_GRID}`} style={{ borderColor: "var(--border-soft)", background: "var(--bg-subtle)" }}>
                      <DebugField model="waypoints" field="pickup_text">
                        <div>
                          <TTFieldLabel>Pick-up Spot</TTFieldLabel>
                          <input type="text" value={wp.pickup} onChange={(e) => updateRouteCopy({ pickup: e.target.value })} placeholder="Pick-up description" className="w-full rounded-lg border px-3 py-2 text-sm outline-none focus:border-gray-400" style={{ borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-1)" }} />
                        </div>
                      </DebugField>
                      {draft.serviceType === "Airport" ? <div aria-hidden="true" /> : (
                        <DebugField model="waypoints" field="pickup_time">
                          <div>
                            <TTFieldLabel>Time</TTFieldLabel>
                            <input type="time" value={wp.pickupTime} onChange={(e) => updateRouteCopy({ pickupTime: e.target.value })} className="w-full rounded-lg border px-3 py-2 text-sm outline-none focus:border-gray-400" style={{ borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-1)" }} />
                          </div>
                        </DebugField>
                      )}
                      <MapLocationPicker theme="light" size="compact" label="Pick-up Spot" value={wp.pickupMapLocation ?? null} onChange={(loc) => updateRouteCopy({ pickupMapLocation: loc })} />
                      <div aria-hidden="true" className="hidden sm:block" />
                    </div>
                    {wp.stopovers.map((stop, i) => (
                      <div key={i} className={`border-b p-3 ${EDIT_ROUTE_ROW_GRID}`} style={{ borderColor: "var(--border-soft)" }}>
                        <input type="text" value={stop.location} onChange={(e) => { const arr = [...wp.stopovers]; arr[i] = { ...arr[i], location: e.target.value }; updateRouteCopy({ stopovers: arr }); }}
                          placeholder={`Stop ${i + 1} description`} className="w-full rounded-lg border px-3 py-2 text-sm outline-none focus:border-gray-400" style={{ borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-1)" }} />
                        <input type="text" value={stop.waitTime} onChange={(e) => { const arr = [...wp.stopovers]; arr[i] = { ...arr[i], waitTime: e.target.value }; updateRouteCopy({ stopovers: arr }); }}
                          placeholder="Wait time" aria-label={`Stop ${i + 1} wait time`} className="w-full rounded-lg border px-3 py-2 text-sm outline-none focus:border-gray-400" style={{ borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-1)" }} />
                        <MapLocationPicker theme="light" size="compact" label={`Stopover ${i + 1}`} value={stop.mapLocation ?? null} onChange={(loc) => { const arr = [...wp.stopovers]; arr[i] = { ...arr[i], mapLocation: loc }; updateRouteCopy({ stopovers: arr }); }} />
                        <button type="button" onClick={() => updateRouteCopy({ stopovers: wp.stopovers.filter((_, j) => j !== i) })} className="flex h-9 w-8 shrink-0 items-center justify-center rounded text-red-400 transition hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-500/10"><IconTrash size={16} /></button>
                      </div>
                    ))}
                    <div className="border-b p-3" style={{ borderColor: "var(--border-soft)" }}>
                      <button type="button" onClick={() => updateRouteCopy({ stopovers: [...wp.stopovers, { location: "", waitTime: "30 min", mapLocation: null }] })} className="inline-flex items-center gap-1 text-sm font-medium text-violet-600 transition hover:text-violet-800">
                        <IconPlus size={16} />Add stopover
                      </button>
                    </div>
                    <div className={`p-3 ${EDIT_ROUTE_ROW_GRID}`} style={{ background: "var(--bg-subtle)" }}>
                      <DebugField model="waypoints" field="dropoff_text">
                        <div>
                          <TTFieldLabel>Drop-off Spot</TTFieldLabel>
                          <input type="text" value={wp.dropoff} onChange={(e) => updateRouteCopy({ dropoff: e.target.value })} placeholder="Drop-off description" className="w-full rounded-lg border px-3 py-2 text-sm outline-none focus:border-gray-400" style={{ borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-1)" }} />
                        </div>
                      </DebugField>
                      <div aria-hidden="true" className="hidden sm:block" />
                      <MapLocationPicker theme="light" size="compact" label="Drop-off Spot" value={wp.dropoffMapLocation ?? null} onChange={(loc) => updateRouteCopy({ dropoffMapLocation: loc })} />
                      <div aria-hidden="true" className="hidden sm:block" />
                    </div>
                  </>
                )}
              </div>
              {routeMapOpen && <RouteMap waypoints={draft.waypoints} />}
            </div>

            {draft.serviceType === "Sightseeing Charter" ? (
              draft.officeLocation && draft.durationTier ? (
                <VehiclePricingTable officeLocation={draft.officeLocation} durationTier={draft.durationTier} pricing={draft.vehiclePricing} onChange={handleVehiclePricingChange} locked={locked} />
              ) : (
                <div className="rounded-xl border border-dashed p-5 text-center text-xs" style={{ borderColor: "var(--border)", background: "var(--bg-subtle)", color: "var(--text-3)" }}>Select an office and duration tier to see available vehicle pricing.</div>
              )
            ) : draft.serviceType === "Airport" ? (
              draft.officeLocation && draft.airport ? (
                <AirportVehiclePricingTable officeLocation={draft.officeLocation} airport={draft.airport} pricing={draft.airportVehiclePricing} onChange={handleAirportVehiclePricingChange} locked={locked} />
              ) : (
                <div className="rounded-xl border border-dashed p-5 text-center text-xs" style={{ borderColor: "var(--border)", background: "var(--bg-subtle)", color: "var(--text-3)" }}>Select an office and airport to see available vehicle pricing.</div>
              )
            ) : (
              <div className="rounded-xl border border-dashed p-5 text-center text-xs" style={{ borderColor: "var(--border)", background: "var(--bg-subtle)", color: "var(--text-3)" }}>Select a service type to see available vehicle pricing.</div>
            )}
          </div>
        </div>

        {/* Footer */}
        <div className="flex flex-wrap items-center justify-between gap-3 border-t px-4 py-3 sm:gap-4 sm:px-6 sm:py-4" style={{ borderColor: "var(--border)", background: "var(--bg-subtle)" }}>
          <div className="flex items-center gap-3">
            <p className={`text-xs ${footerNoteClass}`} style={{ color: saveError ? undefined : "var(--text-3)" }}>{footerNote}</p>
            {!isNew && (
              <button type="button" title="Delete template" onClick={() => setDeleteConfirmOpen(true)} className="inline-flex items-center gap-1.5 rounded-lg px-2 py-1 text-xs font-medium transition hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-500/10" style={{ color: "var(--text-3)" }}>
                <IconTrash size={14} />Delete
              </button>
            )}
          </div>
          <div className="flex items-center gap-3">
            {mode === "edit" && (
              <button type="button" disabled={history.length === 0} title={history.length > 0 ? `Undo: ${history[history.length - 1].label}` : "Nothing to undo yet"} onClick={undo}
                className="inline-flex items-center gap-1.5 rounded-lg border px-3.5 py-2.5 text-sm font-medium transition hover:bg-black/5 disabled:cursor-not-allowed disabled:opacity-45" style={{ borderColor: "var(--border)", background: "var(--bg-card)", color: "var(--text-2)" }}>
                <IconRefresh size={14} />Undo
              </button>
            )}
            <button type="button" onClick={cancelEdits} className="rounded-lg border px-5 py-2.5 text-sm font-medium transition hover:bg-black/5" style={{ borderColor: "var(--border)", color: "var(--text-2)" }}>{mode === "view" ? "Close" : "Cancel"}</button>
            {mode === "view" ? (
              <button type="button" onClick={enterEdit} className="inline-flex items-center gap-2 rounded-lg bg-[#FACC15] px-5 py-2.5 text-sm font-semibold text-[#121621] transition hover:bg-[#eab308]"><IconPencil size={14} />Edit template</button>
            ) : (
              <button type="button" disabled={!saveEnabled} onClick={handleSave} className="rounded-lg bg-[#FACC15] px-6 py-2.5 text-sm font-semibold text-[#121621] transition hover:bg-[#eab308] disabled:cursor-not-allowed disabled:opacity-45">{isNew ? "Create template" : "Save changes"}</button>
            )}
          </div>
        </div>
      </div>

      {deleteConfirmOpen && (
        <ConfirmDialog title="Delete this template?" description={`"${draft.tripName || "Untitled template"}" (${draft.id}) will be permanently removed from the catalog. This can't be undone.`}
          confirmLabel="Delete template" onCancel={() => setDeleteConfirmOpen(false)} onConfirm={() => { onDelete(tour.id); setDeleteConfirmOpen(false); }} />
      )}
    </div>
  );
}

/* ---------------- Pricing CMS ---------------- */
function OfficeFilterChips({ officeFilter, onChange, counts }) {
  return (
    <div className="flex flex-wrap gap-2">
      {["All", ...OFFICE_LOCATIONS].map((office) => (
        <button key={office} type="button" onClick={() => onChange(office)}
          className={`rounded-full px-4 py-1.5 text-sm font-medium transition ${officeFilter === office ? "bg-[#121621] text-white" : "hover:bg-black/10"}`}
          style={officeFilter === office ? {} : { background: "var(--bg-subtle)", color: "var(--text-2)" }}>
          {office} ({counts[office]})
        </button>
      ))}
    </div>
  );
}
const PRICING_TABS = ["Tour Charters", "Airport Price", "Customized Price", "Offices", "Vehicle Lineup"];

function PricingCMSView() {
  const [activeTab, setActiveTab] = useState("Tour Charters");
  const [rows, setRows] = useState(SIGHTSEEING_PRICE_SEED);
  const [airportRows, setAirportRows] = useState(AIRPORT_PRICE_SEED);
  const [customRows, setCustomRows] = useState(CUSTOMIZED_PRICE_SEED);
  const [officeFilter, setOfficeFilter] = useState("All");
  const [editingAirportRow, setEditingAirportRow] = useState(null);
  const [editingSightseeingRow, setEditingSightseeingRow] = useState(null);
  const [editingCustomRow, setEditingCustomRow] = useState(null);

  const sightseeingCounts = useMemo(() => officeCounts(rows), [rows]);
  const airportCounts = useMemo(() => officeCounts(airportRows), [airportRows]);
  const customCounts = useMemo(() => officeCounts(customRows), [customRows]);

  const filteredSightseeing = officeFilter === "All" ? rows : rows.filter((r) => r.office === officeFilter);
  const filteredAirport = officeFilter === "All" ? airportRows : airportRows.filter((r) => r.office === officeFilter);
  const filteredCustom = officeFilter === "All" ? customRows : customRows.filter((r) => r.office === officeFilter);

  const handleRefresh = () => { setRows(SIGHTSEEING_PRICE_SEED); setAirportRows(AIRPORT_PRICE_SEED); setCustomRows(CUSTOMIZED_PRICE_SEED); setOfficeFilter("All"); };

  const th = "px-4 py-3 text-xs font-semibold uppercase tracking-wide";
  return (
    <div className="flex flex-col gap-6">
      <div className="flex flex-wrap items-center justify-between gap-4">
        <h1 className="text-2xl font-bold" style={{ color: "var(--text-1)" }}>Pricing CMS</h1>
        <button type="button" onClick={handleRefresh} className="inline-flex h-9 items-center gap-1.5 rounded-lg border px-4 text-sm font-medium transition hover:bg-black/5" style={{ borderColor: "var(--border)", color: "var(--text-2)", background: "var(--bg-card)" }}>
          <IconRefresh size={16} /> Refresh
        </button>
      </div>

      <div className="flex flex-wrap gap-1 border-b" style={{ borderColor: "var(--border)" }}>
        {PRICING_TABS.map((tab) => (
          <button key={tab} type="button" onClick={() => setActiveTab(tab)}
            className="px-4 py-2.5 text-sm font-medium transition"
            style={activeTab === tab ? { borderBottom: "2px solid #FACC15", color: "var(--text-1)" } : { color: "var(--text-3)" }}>
            {tab}
          </button>
        ))}
      </div>

      {activeTab === "Tour Charters" ? (
        <>
          <OfficeFilterChips officeFilter={officeFilter} onChange={setOfficeFilter} counts={sightseeingCounts} />
          <div className="overflow-hidden rounded-xl border shadow-sm" style={{ borderColor: "var(--border)", background: "var(--bg-card)" }}>
            <table className="w-full text-left text-sm">
              <thead><tr className="border-b" style={{ borderColor: "var(--border-soft)", background: "var(--bg-subtle)" }}>
                {["Vehicle Type","Vehicle Name","Office","Owner","Available","Half Day ¥","Full Day ¥","Action"].map((c) => <th key={c} className={th} style={{ color: "var(--text-3)" }}>{c}</th>)}
              </tr></thead>
              <tbody>
                {filteredSightseeing.map((row) => (
                  <tr key={row.id} onClick={() => setEditingSightseeingRow(row)} className="cursor-pointer border-b transition hover:bg-black/[0.03]" style={{ borderColor: "var(--border-soft)" }}>
                    <td className="px-4 py-3 font-medium" style={{ color: "var(--text-1)" }}>{row.vehicleType}</td>
                    <td className="px-4 py-3" style={{ color: "var(--text-2)" }}>{row.vehicleName}</td>
                    <td className="px-4 py-3" style={{ color: "var(--text-2)" }}>{row.office}</td>
                    <td className="px-4 py-3" style={{ color: "var(--text-2)" }}>{row.owner}</td>
                    <td className="px-4 py-3" onClick={(e) => e.stopPropagation()}><Toggle available={row.available} onToggle={() => setRows((p) => p.map((r) => r.id === row.id ? { ...r, available: !r.available } : r))} /></td>
                    <td className="px-4 py-3 tabular-nums" style={{ color: "var(--text-1)" }}>{formatPrice(row.halfDayPrice)}</td>
                    <td className="px-4 py-3 tabular-nums" style={{ color: "var(--text-1)" }}>{formatPrice(row.fullDayPrice)}</td>
                    <td className="px-4 py-3"><button type="button" onClick={(e) => { e.stopPropagation(); setEditingSightseeingRow(row); }} className="rounded p-1.5 text-gray-400 transition hover:bg-black/5 hover:text-blue-600"><IconPencil size={16} /></button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {editingSightseeingRow && (
            <SightseeingPriceModal row={editingSightseeingRow} onClose={() => setEditingSightseeingRow(null)}
              onSave={(u) => { setRows((p) => p.map((r) => r.id === u.id ? u : r)); setEditingSightseeingRow(null); }} />
          )}
        </>
      ) : activeTab === "Airport Price" ? (
        <>
          <OfficeFilterChips officeFilter={officeFilter} onChange={setOfficeFilter} counts={airportCounts} />
          <div className="overflow-x-auto rounded-xl border shadow-sm" style={{ borderColor: "var(--border)", background: "var(--bg-card)" }}>
            <table className="w-full min-w-[900px] text-left text-sm">
              <thead><tr className="border-b" style={{ borderColor: "var(--border-soft)", background: "var(--bg-subtle)" }}>
                {["Vehicle Type","Vehicle Name","Office","Airports & Fixed Fee","Owner","Available","Action"].map((c) => <th key={c} className={th} style={{ color: "var(--text-3)" }}>{c}</th>)}
              </tr></thead>
              <tbody>
                {filteredAirport.map((row) => (
                  <tr key={row.id} onClick={() => setEditingAirportRow(row)} className="cursor-pointer border-b transition hover:bg-black/[0.03]" style={{ borderColor: "var(--border-soft)" }}>
                    <td className="px-4 py-3 align-top font-medium" style={{ color: "var(--text-1)" }}>{row.vehicleType}</td>
                    <td className="px-4 py-3 align-top" style={{ color: "var(--text-2)" }}>{row.vehicleName}</td>
                    <td className="px-4 py-3 align-top" style={{ color: "var(--text-2)" }}>{row.office}</td>
                    <td className="px-4 py-3 align-top">
                      {row.legs.length === 0 ? <span style={{ color: "var(--text-3)" }}>—</span> : (
                        <div className="flex flex-col gap-1">
                          {row.legs.map((leg) => (
                            <div key={leg.airport} className="flex items-center gap-2 text-xs">
                              <span className="whitespace-nowrap rounded-md border px-2 py-0.5 font-medium" style={{ borderColor: "var(--border)", background: "var(--bg-subtle)", color: "var(--text-2)" }}>{AIRPORT_CODES[leg.airport] || leg.airport}</span>
                              <span className="tabular-nums font-semibold" style={{ color: "var(--text-1)" }}>{formatPrice(leg.fixedFee)}</span>
                            </div>
                          ))}
                        </div>
                      )}
                    </td>

/* ---------------- Booking flow (ported from lib/bookingData.ts + components/booking/ItineraryPlanner.tsx) ---------------- */
const AUTUMN_FOLIAGE_DEMO_ITINERARY = {
  slug: "autumn-foliage-deer-paths", tripName: "Autumn Foliage & Deer Paths",
  pickup: "THE OSAKA STATION HOTEL, Autograph Collection", dropoff: "THE OSAKA STATION HOTEL, Autograph Collection",
  stopovers: [{ location: "Tōdai-ji", waitTime: "3h" }, { location: "Mount Wakakusa", waitTime: "None" }],
  defaultTime: "09:00", tripDistanceKm: 80.1, drivingMins: 118, waitingMins: 180, totalMins: 298,
};
function parseWaitMins(waitTime) {
  if (!waitTime || waitTime.toLowerCase() === "none") return 0;
  const hourMatch = waitTime.match(/(\d+)\s*h/i);
  const minMatch = waitTime.match(/(\d+)\s*min/i);
  return (hourMatch ? parseInt(hourMatch[1], 10) * 60 : 0) + (minMatch ? parseInt(minMatch[1], 10) : 0);
}
function buildItineraryFromTour(tour) {
  const slug = slugifyTripName(tour.tripName);
  if (slug === "autumn-foliage-deer-paths") return AUTUMN_FOLIAGE_DEMO_ITINERARY;
  const waitingMins = tour.waypoints.stopovers.reduce((sum, s) => sum + parseWaitMins(s.waitTime), 0);
  const totalMins = tour.tripDurationMins ?? tour.routeDurationMins ?? 0;
  const drivingMins = Math.max(totalMins - waitingMins, 0);
  return {
    slug, tripName: tour.tripName, pickup: tour.waypoints.pickup, dropoff: tour.waypoints.dropoff,
    stopovers: tour.waypoints.stopovers.map((s) => ({ location: s.location, waitTime: s.waitTime || "None" })),
    defaultTime: tour.waypoints.pickupTime, tripDistanceKm: tour.tripDistanceKm ?? tour.routeDistanceKm ?? 0,
    drivingMins, waitingMins, totalMins,
  };
}
function formatDurationLabel(mins) {
  const h = Math.floor(mins / 60); const m = mins % 60;
  if (h === 0) return `${m}mins`;
  if (m === 0) return `${h}hrs`;
  return `${h}hrs ${m}mins`;
}

          <div className="flex flex-1 flex-col rounded-[2rem] border border-white/20 bg-slate-900/40 p-4 shadow-2xl backdrop-blur-xl sm:p-8">
            <div className="mb-8 flex flex-wrap items-center justify-center gap-2 sm:gap-4">
              {["Itinerary Planning", "Vehicle Class", "Additional Info", "Review & Submit"].map((label, i) => {
                const step = i + 1; const active = step === 1;
                return (
                  <div key={label} className="flex items-center gap-2">
                    <div className={`flex h-8 w-8 items-center justify-center rounded-full text-sm font-bold ${active ? "bg-[#FACC15] text-[#121621]" : "border border-white/30 text-white/70"}`}>{step}</div>
                    <span className={`hidden text-sm sm:inline ${active ? "font-semibold text-[#FACC15]" : "text-white/60"}`}>{label}</span>
                    {step < 4 && <div className="mx-1 hidden h-px w-6 bg-white/20 sm:block" />}
                  </div>
                );
              })}
            </div>

            <h1 className="mb-8 text-center text-2xl font-bold text-white sm:text-4xl">Chartered Tour</h1>

            <div className={`mb-6 rounded-2xl border p-4 ${dateReady ? "border-white/10 bg-white/5" : "border-amber-400/40 bg-amber-500/5 ring-1 ring-amber-400/30"}`}>
              <div className="mb-3 flex flex-wrap items-center gap-2">
                <p className="text-xs font-semibold uppercase tracking-wide text-white/50">Scheduled trip date</p>
                {!dateReady && <span className="inline-flex items-center gap-1 rounded-full bg-amber-500/20 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-amber-300">Required</span>}
              </div>
              <div className="grid grid-cols-1 gap-3 sm:grid-cols-2">
                <label className="flex items-center gap-3 rounded-full border border-white/10 bg-white/5 px-4 py-3 text-white">
                  <span className="text-xs text-white/50">Date</span>
                  <input type="date" required value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} className="ml-auto bg-transparent text-sm outline-none [color-scheme:dark]" />
                </label>
                <label className="flex items-center gap-3 rounded-full border border-white/10 bg-white/5 px-4 py-3 text-white">
                  <span className="text-xs text-white/50">Time</span>
                  <input type="time" value={selectedTime} onChange={(e) => setSelectedTime(e.target.value)} className="ml-auto bg-transparent text-sm outline-none [color-scheme:dark]" />
                </label>
              </div>
              <p className="mt-2 text-center text-xs text-white/40">{formattedDate ? `${formattedDate} · Ref ${sequence}` : "Choose the date for your trip · Ref " + sequence}</p>
            </div>

            <div className="mb-6">
              {!locationsReady && (
                <div role="alert" className="mb-4 flex gap-3 rounded-2xl border border-amber-400/40 bg-amber-500/10 p-4 text-amber-100">

                    <p className="font-semibold text-amber-200">Review your pick-up &amp; drop-off locations</p>

                  </div>
