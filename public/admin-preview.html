              )}
              <div className="grid grid-cols-1 gap-4 lg:grid-cols-2 lg:items-stretch">
                <div className="h-full rounded-2xl border border-white/10 bg-white/5 p-4">
                  <BookingLocationPoint kind="pickup" label="Pick-up spot" value={pickup} defaultValue={defaultPickup} confirmed={pickupConfirmed}
                    mapLocation={pickupMap} onMapLocationChange={setPickupMap}
                    onChange={(next) => { setPickup(next); setPickupConfirmed(false); }}
                    onReset={() => { setPickup(defaultPickup); setPickupMap(null); setPickupConfirmed(false); }}
                    onConfirm={() => setPickupConfirmed(true)} isFirst />
                  {stopovers.map((stop, i) => (
                    <BookingStopoverPoint key={i} index={i} location={stop.location} waitTime={stop.waitTime} mapLocation={stop.mapLocation}
                      onLocationChange={(location) => setStopovers((prev) => prev.map((s, j) => (j === i ? { ...s, location } : s)))}
                      onWaitTimeChange={(waitTime) => setStopovers((prev) => prev.map((s, j) => (j === i ? { ...s, waitTime } : s)))}
                      onMapLocationChange={(mapLocation) => setStopovers((prev) => prev.map((s, j) => (j === i ? { ...s, mapLocation } : s)))} />
                  ))}
                  <button type="button" className="my-3 ml-8 inline-flex items-center gap-2 rounded-full border border-white/30 px-4 py-2 text-sm text-white/80 transition hover:bg-white/10"><IconPlus size={16} />Add a new Stopover</button>
                  <BookingLocationPoint kind="dropoff" label="Drop-off Spot" value={dropoff} defaultValue={defaultDropoff} confirmed={dropoffConfirmed}
                    mapLocation={dropoffMap} onMapLocationChange={setDropoffMap}
                    onChange={(next) => { setDropoff(next); setDropoffConfirmed(false); }}
                    onReset={() => { setDropoff(defaultDropoff); setDropoffMap(null); setDropoffConfirmed(false); }}
                    onConfirm={() => setDropoffConfirmed(true)} isLast />
                </div>
                <BookingRouteMapPreview tripName={itinerary.tripName} />
              </div>
            </div>

            <div className="mb-8 grid grid-cols-2 gap-3 sm:grid-cols-4">
              {[
                { label: "Trip Distance", value: `${itinerary.tripDistanceKm.toFixed(1)} km` },
                { label: "Driving", value: formatDurationLabel(itinerary.drivingMins) },
                { label: "Sightseeing", value: formatDurationLabel(itinerary.waitingMins) },
                { label: "Total", value: formatDurationLabel(itinerary.totalMins), highlight: true },
              ].map(({ label, value, highlight }) => (
                <div key={label} className="rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-center">
                  <p className="text-xs text-white/50">{label}</p>
                  <p className={`mt-1 text-sm font-semibold sm:text-base ${highlight ? "text-[#FACC15]" : "text-white"}`}>{value}</p>
                </div>
              ))}
            </div>

            <div className="mb-8 grid grid-cols-1 gap-3 sm:grid-cols-2">
              <label className="flex items-center gap-3 rounded-full border border-white/10 bg-white/5 px-4 py-3 text-white">
                <span className="text-sm text-white/50">Passenger</span>
                <select value={passengers} onChange={(e) => setPassengers(Number(e.target.value))} className="ml-auto bg-transparent text-sm outline-none">
                  {[1, 2, 3, 4, 5, 6, 7, 8].map((n) => <option key={n} value={n} className="bg-slate-800">{n}</option>)}
                </select>
              </label>
              <label className="flex items-center gap-3 rounded-full border border-white/10 bg-white/5 px-4 py-3 text-white">
                <span className="text-lg">🧳</span>
                <span className="text-sm text-white/50">Check-in size luggage</span>
                <select value={luggage} onChange={(e) => setLuggage(Number(e.target.value))} className="ml-auto bg-transparent text-sm outline-none">
                  {[0, 1, 2, 3, 4].map((n) => <option key={n} value={n} className="bg-slate-800">{n}</option>)}
                </select>
              </label>
            </div>

            <input type="text" value={otherLuggage} onChange={(e) => setOtherLuggage(e.target.value)} placeholder="Other luggage — Skis, stroller, wheel chair, etc"
              className="mb-8 w-full rounded-full border border-white/10 bg-white/5 px-5 py-3 text-sm text-white placeholder-white/40 outline-none focus:border-white/30" />

            <button type="button" disabled={!canContinue} className={`w-full rounded-full border py-4 text-base font-semibold backdrop-blur-md transition ${canContinue ? "border-white/20 bg-slate-900/60 text-white hover:bg-slate-800/80" : "cursor-not-allowed border-white/10 bg-white/5 text-white/40"}`}>Continue</button>
            {!canContinue && (
              <p className="mt-3 text-center text-sm text-amber-300/90">
                {!dateReady && !locationsReady ? "Select your trip date and confirm both pick-up and drop-off locations to continue." : !dateReady ? "Select your scheduled trip date to continue." : "Confirm both pick-up and drop-off locations above to continue."}
              </p>
            )}
            {canContinue && <p className="mt-3 text-center text-xs text-emerald-400/80">Trip date and locations confirmed — ready to continue.</p>}
          </div>

          <p className="mt-4 text-center text-xs text-white/40">{itinerary.tripName} · Prototype booking flow</p>
        </div>
      </div>
    </div>
  );
}
function BookingRouteMapPreview({ tripName }) {
  return (
    <div className="flex h-full min-h-[280px] flex-col overflow-hidden rounded-2xl border border-white/10 bg-white/5">
      <div className="relative min-h-[220px] flex-1">
        <div className="absolute inset-0" style={{ background: "linear-gradient(135deg, #0f172a 0%, #1e293b 55%, #064e3b 100%)" }} />
        <svg className="absolute inset-0 h-full w-full" viewBox="0 0 400 280" preserveAspectRatio="none">
          <path d="M 50 220 Q 130 120, 210 140 T 350 80" fill="none" stroke="#FACC15" strokeWidth="3" strokeDasharray="6 4" />
          <circle cx="50" cy="220" r="7" fill="#34d399" stroke="#fff" strokeWidth="2" />
          <circle cx="210" cy="140" r="6" fill="#FACC15" stroke="#fff" strokeWidth="2" />
          <circle cx="280" cy="110" r="6" fill="#FACC15" stroke="#fff" strokeWidth="2" />
          <circle cx="350" cy="80" r="7" fill="#f87171" stroke="#fff" strokeWidth="2" />
        </svg>
        <div className="absolute left-3 top-3 rounded-lg bg-black/40 px-2.5 py-1 text-[10px] font-medium text-white/80 backdrop-blur-sm">Route Preview</div>
      </div>
      <div className="flex items-center gap-2 border-t border-white/10 px-4 py-3 text-xs text-white/60">
        <IconMapPin size={14} className="shrink-0 text-[#FACC15]" />
        <span>Route Preview</span>
        <span className="ml-auto truncate text-white/40">{tripName}</span>
      </div>
    </div>
  );
}
function BookingLocationPoint({ kind, label, value, defaultValue, confirmed, mapLocation, onMapLocationChange, onChange, onReset, onConfirm, isFirst, isLast }) {
  const isDefault = value.trim() === defaultValue.trim();
  const canConfirm = value.trim().length > 0;
  return (
    <div className={`relative flex gap-4 pl-2 ${confirmed ? "rounded-xl ring-1 ring-emerald-400/30" : "rounded-xl ring-2 ring-amber-400/50 ring-offset-2 ring-offset-transparent"}`}>
      {!isLast && <div className="absolute left-[19px] top-8 h-[calc(100%+8px)] w-px bg-white/20" />}
      <div className={`relative z-10 mt-1 flex h-8 w-8 shrink-0 items-center justify-center rounded-full ${isFirst ? "bg-emerald-500/20" : isLast ? "bg-rose-500/20" : "bg-white/10"}`}>
        <IconMapPin size={16} className={isFirst ? "text-emerald-400" : "text-rose-400"} />
      </div>
      <div className="flex min-w-0 flex-1 gap-3 pb-6 pt-0.5">
        <div className="flex min-w-0 flex-1 flex-col gap-2">
          <div className="flex flex-wrap items-center gap-2">
            <p className="text-xs text-white/50">{label}</p>
            {confirmed ? (
              <span className="inline-flex items-center gap-1 rounded-full bg-emerald-500/20 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-emerald-300"><IconCheck size={12} />Confirmed</span>
            ) : (
              <span className="inline-flex items-center gap-1 rounded-full bg-amber-500/20 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-amber-300">Needs review</span>
            )}
            {!confirmed && isDefault && <span className="text-[10px] text-white/40">Default location</span>}
          </div>
          <input type="text" value={value} onChange={(e) => onChange(e.target.value)} aria-label={`${label} description`}
            placeholder={`Enter your ${kind === "pickup" ? "pick-up" : "drop-off"} description`}
            className="w-full rounded-lg border border-white/15 bg-white/5 px-3 py-2 text-sm text-white outline-none placeholder:text-white/30 focus:border-amber-400/50 focus:ring-1 focus:ring-amber-400/30" />
          <div className="flex flex-wrap gap-2">
            <button type="button" onClick={onReset} className="inline-flex items-center gap-1.5 rounded-full border border-white/20 px-3 py-1.5 text-xs font-medium text-white/70 transition hover:bg-white/10"><IconRefresh size={12} />Reset to default</button>
            <button type="button" onClick={onConfirm} disabled={!canConfirm}
              className={`inline-flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-semibold transition ${canConfirm ? (confirmed ? "bg-emerald-500/25 text-emerald-200" : "bg-[#FACC15] text-[#121621] hover:bg-[#eab308]") : "cursor-not-allowed bg-white/5 text-white/30"}`}>
              <IconCheck size={12} />{confirmed ? "Confirmed" : "Confirm location"}
            </button>
          </div>
        </div>
        <MapLocationPicker label={label} value={mapLocation} onChange={onMapLocationChange} theme="dark" />
      </div>
    </div>
  );
}
function BookingStopoverPoint({ index, location, waitTime, mapLocation, onLocationChange, onWaitTimeChange, onMapLocationChange }) {
  return (
    <div className="relative flex gap-4 pl-2">
      <div className="absolute left-[19px] top-8 h-[calc(100%+8px)] w-px bg-white/20" />
      <div className="relative z-10 flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-white/10">
        <span className="flex h-4 w-4 items-center justify-center rounded-full border border-white/40 text-[10px] text-white/70">{index + 1}</span>
      </div>
      <div className="flex min-w-0 flex-1 gap-3 pb-6">
        <div className="flex min-w-0 flex-1 flex-col gap-2">
          <p className="text-xs text-white/50">Stopover {index + 1}</p>
          <input type="text" value={location} onChange={(e) => onLocationChange(e.target.value)} aria-label={`Stopover ${index + 1} description`}
            placeholder="Sightseeing spot name or description" className="w-full rounded-lg border border-white/15 bg-white/5 px-3 py-2 text-sm text-white outline-none placeholder:text-white/30 focus:border-white/30 focus:ring-1 focus:ring-white/20" />
          <label className="flex items-center gap-2 text-xs text-white/50">
            Standby time
            <input type="text" value={waitTime} onChange={(e) => onWaitTimeChange(e.target.value)} className="flex-1 rounded-lg border border-white/15 bg-white/5 px-3 py-1.5 text-sm text-white outline-none focus:border-white/30" />
          </label>
        </div>
        <MapLocationPicker label={`Stopover ${index + 1}`} value={mapLocation} onChange={onMapLocationChange} theme="dark" />
      </div>
    </div>
  );
}

/* ---------------- Placeholder view (Orders / Dispatch Board) ---------------- */
function PlaceholderView({ title }) {
  return (
    <div className="flex flex-col items-center justify-center py-32" style={{ color: "var(--text-3)" }}>
      <p className="text-lg font-medium" style={{ color: "var(--text-2)" }}>{title}</p>
      <p className="mt-1 text-sm">This section is not part of the prototype.</p>
    </div>
  );
}

/* ---------------- App shell ---------------- */
function createEmptyTour() {
  return {
    id: "-----", reference: "-----", tripName: "", officeLocation: null, durationTier: null, status: "inactive", price: null, startTime: "09:00",
    viewedCount: 0, bookedCount: 0, serviceType: null, airport: null,
    userName: null, userEmail: null, userSource: null, paymentStatus: null, passengers: null, luggage: null,
    driverName: null, plateNumber: null, useDefaultPrice: true, vehiclePricing: null, airportVehiclePricing: null,
    waypoints: emptyWaypoints(), routeDistanceKm: null, routeDurationMins: null, tripDistanceKm: null, tripDurationMins: null,
    previewLinks: { tourDetails: "https://www.zengoride.com/tours/new-tour", tourBooking: "https://exert-hula-resilient.ngrok-free.dev/tours/new-tour/0001/2026-09-02" },
  };
}
function generateNextId(tours, serviceType, office) {
  if (serviceType === "Airport") {
    const nums = tours.map((t) => { const m = t.id.match(/^#A(\d{4})/); return m ? parseInt(m[1],10) : 0; }).filter((n) => n>0);
    const next = nums.length ? Math.max(...nums)+1 : 1;
    return `#A${String(next).padStart(4,"0")}${(office||"T")[0].toUpperCase()}`;
  }
  const nums = tours.map((t) => { const m = t.id.match(/#T(\d{4})A/); return m ? parseInt(m[1],10) : 0; }).filter((n) => n>0);
  const next = nums.length ? Math.max(...nums)+1 : 1;
  return `#T${String(next).padStart(4,"0")}A`;
}

function AdminShell() {
  const [activeView, setActiveView] = useState("tour-catalog");
  const [tours, setTours] = useState(SEED_TOURS);
  const [modalTour, setModalTour] = useState(null);
  const [isNewTour, setIsNewTour] = useState(false);
  const [debugMode, setDebugMode] = useState(false);
  const [bookingPreviewTour, setBookingPreviewTour] = useState(null);
  const bookingItinerary = useMemo(() => (bookingPreviewTour ? buildItineraryFromTour(bookingPreviewTour) : null), [bookingPreviewTour]);
  const openBooking = useCallback((tour) => setBookingPreviewTour(tour), []);

  const openEdit = useCallback((id) => { const t = tours.find((x) => x.id === id); if (t) { setModalTour(t); setIsNewTour(false); } }, [tours]);
  const openAdd = useCallback(() => { setModalTour(createEmptyTour()); setIsNewTour(true); }, []);
  const handleToggleStatus = useCallback((id) => setTours((prev) => prev.map((t) => t.id === id ? { ...t, status: t.status === "active" ? "inactive" : "active" } : t)), []);
  const handleDelete = useCallback((id) => { setTours((prev) => prev.filter((t) => t.id !== id)); setModalTour((prev) => prev && prev.id === id ? null : prev); }, []);
  const handleSave = useCallback((saved) => {
    if (isNewTour) {
      const newId = generateNextId(tours, saved.serviceType, saved.officeLocation);
      const finalized = { ...saved, id: newId };
      setTours((prev) => [...prev, finalized]);
      setModalTour(null);
    } else {
      setTours((prev) => prev.map((t) => t.id === saved.id ? saved : t));
      setModalTour(null);
    }
    setIsNewTour(false);
  }, [tours, isNewTour]);
  const handleRefresh = useCallback(() => setTours(SEED_TOURS), []);

  const viewTitles = { orders: "Orders", "dispatch-board": "Dispatch Board" };

  return (
    <DebugCtx.Provider value={{ debugMode, toggle: () => setDebugMode((v) => !v) }}>
      <div className="min-h-screen" style={{ background: "var(--bg-app)" }}>
        <Sidebar activeView={activeView} onNavigate={setActiveView} />
        <main className="ml-56 min-h-screen p-8">
          {activeView === "tour-catalog" ? (
            <TourCatalogView tours={tours} onToggleStatus={handleToggleStatus} onEdit={openEdit} onAddTour={openAdd} onRefresh={handleRefresh} onDelete={handleDelete} onOpenBooking={openBooking} />
          ) : activeView === "pricing-cms" ? (
            <PricingCMSView />
          ) : (
            <PlaceholderView title={viewTitles[activeView]} />
          )}
        </main>
        {modalTour && (
          <TourTemplateModal tour={modalTour} isNew={isNewTour}
            onClose={() => { setModalTour(null); setIsNewTour(false); }}
            onSave={handleSave} onToggleStatus={handleToggleStatus} onDelete={handleDelete} onOpenBooking={openBooking} />
        )}
        {bookingPreviewTour && bookingItinerary && (
          <ItineraryPlanner itinerary={bookingItinerary} sequence={bookingPreviewTour.id.replace(/[^0-9]/g, "").padStart(4, "0").slice(-4) || "0001"} onClose={() => setBookingPreviewTour(null)} />
        )}
      </div>
    </DebugCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AdminShell />);
</script>
